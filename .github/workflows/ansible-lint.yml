---
name: Ansible Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mock Vault File
        run: |
          cp examples/vault.yml.example ansible/group_vars/all/vault.yml

      - name: Build collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p ./.collections --force

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26
        with:
          working_directory: "ansible"
        env:
          ANSIBLE_CONFIG: "ansible-ci.cfg"
          ANSIBLE_COLLECTIONS_PATH: "${{ github.workspace }}/.collections"

      - name: Lint YAML files
        run: yamllint -c ansible/.yamllint -s ansible/ .github/

      - name: shellcheck rendered scripts
        run: shellcheck ansible/roles/alloy/files/smartmon.sh

      - name: Check vault example completeness
        run: |
          grep -rhoE 'vault_[a-z0-9_]+' ansible/ | sort -u > /tmp/used
          grep -oE '^vault_[a-z0-9_]+' examples/vault.yml.example | sort -u > /tmp/defined
          missing=$(comm -23 /tmp/used /tmp/defined | grep -vE '^vault_(pass|password_file|headers)$' || true)
          if [ -n "$missing" ]; then echo "Missing from vault.yml.example:"; echo "$missing"; exit 1; fi

      - name: Reject self-referential vars
        run: |
          python3 - <<'EOF'
          import yaml, re, glob, sys
          bad = []
          for f in glob.glob('ansible/group_vars/**/*.yml', recursive=True) + glob.glob('ansible/host_vars/*.yml'):
              for k, v in (yaml.safe_load(open(f)) or {}).items():
                  if isinstance(v, str) and k in re.findall(r'\{\{\s*([a-z_0-9]+)', v):
                      bad.append(f"{f}: {k}: {v}")
          if bad:
              print("Self-referential variables:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Reject register names that shadow defined variables
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys
          defined = {}
          for f in (glob.glob('ansible/roles/*/defaults/*.yml')
                    + glob.glob('ansible/group_vars/**/*.yml', recursive=True)
                    + glob.glob('ansible/host_vars/*.yml')):
              d = yaml.safe_load(open(f))
              if isinstance(d, dict):
                  for k in d:
                      defined.setdefault(k, []).append(f)
          bad = []
          for f in glob.glob('ansible/roles/*/tasks/*.yml'):
              for t in (yaml.safe_load(open(f)) or []):
                  if isinstance(t, dict) and t.get('register') in defined:
                      bad.append(f"{f}: register: {t['register']} shadows {defined[t['register']]}")
          if bad:
              print("Registered variables shadowing defined vars:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Check podman_service template sources exist
        run: |
          python3 - <<'EOF'
          import yaml, glob, os, sys
          bad = []
          for f in glob.glob('ansible/roles/*/tasks/main.yml'):
              role = f.split('/')[2]
              for t in (yaml.safe_load(open(f)) or []):
                  if not isinstance(t, dict) or 'ansible.builtin.include_role' not in t:
                      continue
                  v = t.get('vars') or {}
                  srcs = [e['src'] for e in (v.get('podman_service_templates') or [])
                          if isinstance(e, dict) and 'src' in e]
                  srcs += [n + '.j2' for n in (v.get('podman_service_quadlets') or [])]
                  srcs += [n + '.j2' for n in (v.get('podman_service_units') or [])]
                  for s in srcs:
                      if '{{' in s:
                          continue
                      p = f'ansible/roles/{role}/templates/{s}'
                      if not os.path.exists(p):
                          bad.append(f"{role}: {s} -> {p}")
          if bad:
              print("Missing template sources:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Check template destinations have a created parent directory
        run: |
          python3 - <<'EOF'
          import yaml, glob, posixpath, sys
          bad = []
          for f in glob.glob('ansible/roles/*/tasks/main.yml'):
              role, tasks = f.split('/')[2], (yaml.safe_load(open(f)) or [])
              pre = set()
              for t in tasks:
                  if isinstance(t, dict) and 'ansible.builtin.file' in t \
                     and t['ansible.builtin.file'].get('state') == 'directory':
                      lp = t.get('loop') or []
                      if isinstance(lp, list):
                          pre |= {str(x) for x in lp}
              for t in tasks:
                  if not isinstance(t, dict) or 'ansible.builtin.include_role' not in t:
                      continue
                  v = t.get('vars') or {}
                  dirs = set(v.get('podman_service_dirs') or []) | pre
                  for e in (v.get('podman_service_templates') or []) + (v.get('podman_service_secrets') or []):
                      parent = posixpath.dirname(str(e.get('dest')))
                      if parent not in dirs:
                          bad.append(f"{role}: {e.get('dest')} (parent {parent} not created)")
          if bad:
              print("Template destinations without a created parent:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Reject handlers that are never notified
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys

          def collect(tasks, out):
              for t in tasks or []:
                  if not isinstance(t, dict):
                      continue
                  n = t.get('notify')
                  if isinstance(n, str):
                      out.add(n)
                  elif isinstance(n, list):
                      out |= set(n)
                  for k in ('block', 'rescue', 'always'):
                      if k in t:
                          collect(t[k], out)

          bad = []
          for hf in glob.glob('ansible/roles/*/handlers/main.yml'):
              role = hf.split('/')[2]
              handlers = yaml.safe_load(open(hf)) or []
              notified = set()
              for sf in glob.glob(f'ansible/roles/{role}/tasks/*.yml') + [hf]:
                  collect(yaml.safe_load(open(sf)), notified)
              for h in handlers:
                  if not isinstance(h, dict):
                      continue
                  name = h.get('name')
                  if name and name not in notified and h.get('listen') not in notified:
                      bad.append(f"{role}: {name}")
          if bad:
              print("Handlers defined but never notified:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Check every endpoint has a route and an auth rule
        run: |
          python3 - <<'EOF'
          import yaml, sys
          REG = 'ansible/group_vars/all/endpoints.yml'
          KEY = 'service_endpoints'
          ep = yaml.safe_load(open(REG))[KEY]
          caddy = open('ansible/roles/caddy/templates/Caddyfile.j2').read()
          authelia = open('ansible/roles/authelia/templates/configuration.yml.j2').read()
          bad = []
          for name, e in ep.items():
              if (e or {}).get('root'):
                  c_ref, a_ref = "\n{{ vault_domain }} {", "domain: '{{ vault_domain }}'"
              else:
                  c_ref = a_ref = f"{KEY}['{name}']"
              if c_ref not in caddy:
                  bad.append(f"{name}: in registry but no block in Caddyfile.j2")
              if a_ref not in authelia:
                  bad.append(f"{name}: in registry but no access_control rule")
          if bad:
              print("Endpoint drift:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Check quadlet [Service] policy
        run: |
          python3 - <<'EOF'
          import re, glob, sys, os
          bad = []
          for f in glob.glob('ansible/roles/*/templates/*.container.j2'):
              name = os.path.basename(f)
              body = open(f).read()
              svc = re.search(r'^\[Service\](.*?)(?=^\[|\Z)', body, re.M | re.S)
              if not svc:
                  continue
              svc = svc.group(1)
              if re.search(r'^Restart=', svc, re.M) and not re.search(r'^RestartSec=', svc, re.M):
                  bad.append(f"{name}: Restart= without RestartSec=")
              stop = re.search(r'^StopTimeout=(\d+)', body, re.M)
              tstop = re.search(r'^TimeoutStopSec=(\d+)', svc, re.M)
              if stop and tstop and int(tstop.group(1)) != int(stop.group(1)) + 10:
                  bad.append(
                      f"{name}: TimeoutStopSec={tstop.group(1)} should be "
                      f"{int(stop.group(1)) + 10} (StopTimeout + 10)")
              if stop and not tstop:
                  bad.append(f"{name}: StopTimeout= without TimeoutStopSec=")
              for key in ('StartLimitBurst', 'StartLimitIntervalSec'):
                  if re.search(rf'^{key}=', svc, re.M):
                      bad.append(f"{name}: {key} belongs in [Unit], not [Service]")
          if bad:
              print("Quadlet [Service] policy:"); print(*bad, sep="\n"); sys.exit(1)
          EOF

      - name: Reject notify targets with no matching handler
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys, os
          def walk(tasks):
              for t in tasks or []:
                  yield t
                  for k in ('block', 'rescue', 'always'):
                      yield from walk(t.get(k))
          bad = []
          for role in glob.glob('ansible/roles/*'):
              defined = set()
              for hf in glob.glob(f'{role}/handlers/*.yml'):
                  for h in walk(yaml.safe_load(open(hf))):
                      if h.get('name'): defined.add(h['name'])
                      for l in ([h['listen']] if isinstance(h.get('listen'), str)
                                else h.get('listen', [])): defined.add(l)
              for tf in glob.glob(f'{role}/tasks/*.yml'):
                  for t in walk(yaml.safe_load(open(tf))):
                      n = t.get('notify')
                      for target in ([n] if isinstance(n, str) else n or []):
                          if target not in defined:
                              bad.append(f"{os.path.basename(role)}: notify '{target}' has no handler")
          if bad:
              print("Dangling notify targets:"); print(*bad, sep="\n"); sys.exit(1)
          EOF
