---
name: Ansible Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync locked environment
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Mock Vault File
        run: |
          cp examples/vault.yml.example ansible/group_vars/all/vault.yml
          printf 'ci-placeholder' > "$RUNNER_TEMP/vault_pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"

      - name: Cache collections
        id: collections-cache
        uses: actions/cache@v6
        with:
          path: .collections
          key: collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Build collections
        if: steps.collections-cache.outputs.cache-hit != 'true'
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

      - name: Lint YAML files
        run: yamllint -c ansible/.yamllint -s ansible/ .github/

      - name: shellcheck rendered scripts
        run: shellcheck ansible/roles/alloy/files/smartmon.sh

      - name: Structural checks
        run: python scripts/ci/run.py
