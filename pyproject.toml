[project]
name = "nova-homelab"
version = "0.1.0"
description = "Ansible development environment for the nova-homelab repo"
requires-python = ">=3.14"
dependencies = [
    "ansible-core==2.22.0",
    "ansible-lint==26.11.0",
    "ruff==0.17.6",
    "yamllint==1.38.0",
]

[tool.uv]
required-version = ">=0.13.0"
python-preference = "only-managed"

[tool.ruff]
extend-exclude = [".collections"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "C4", "RET", "RUF", "S", "PL"]
ignore = [
    "E501",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "S603",
    "S607",
]

[tool.ruff.lint.isort]
known-first-party = ["_common"]

[tool.ruff.lint.per-file-ignores]
"scripts/ci/*.py" = ["S101", "S310", "S701"]
