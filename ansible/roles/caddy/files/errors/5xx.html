<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="15">
    <title>Service unavailable</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f6f4;
            --fg: #1d1d1b;
            --muted: #6b6b66;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141413;
                --fg: #ecebe6;
                --muted: #9a9993;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 system-ui, sans-serif;
            padding: 16px;
            box-sizing: border-box;
        }

        main {
            max-width: 32rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 .5rem;
        }

        p {
            margin: .25rem 0;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main>
        <h1>This service is restarting</h1>
        <p>It is either updating or recovering and should be back within a minute.</p>
        <p>This page reloads itself every 15 seconds.</p>
    </main>
</body>

</html>
