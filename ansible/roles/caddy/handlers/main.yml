---
- name: Restart caddy
  ansible.builtin.systemd:
    daemon_reload: true
    name: caddy.service
    state: restarted
    enabled: true
    scope: user
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy.service
    state: reloaded
    scope: user
  ignore_errors: "{{ ansible_check_mode }}"
