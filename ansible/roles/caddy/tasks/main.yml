---
- name: Verify Caddy build and static directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ stacks_path }}/caddy/caddy-build"
    - "{{ caddy_srv_path }}"

- name: Copy static files served by Caddy
  ansible.builtin.copy:
    src: "srv/{{ item }}"
    dest: "{{ caddy_srv_path }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ caddy_static_files }}"

- name: Upload Containerfile
  ansible.builtin.template:
    src: "Containerfile.j2"
    dest: "{{ stacks_path }}/caddy/caddy-build/Containerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  register: caddy_containerfile

- name: Build Caddy image with the Cloudflare DNS plugin
  containers.podman.podman_image:
    name: custom-caddy
    tag: "{{ caddy_version }}"
    path: "{{ stacks_path }}/caddy/caddy-build"
    force: "{{ caddy_containerfile is changed }}"
  register: caddy_image_build

- name: Deploy Caddy
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: caddy
    podman_service_dirs:
      - "{{ stacks_path }}/caddy"
      - "{{ stacks_path }}/caddy/data"
      - "{{ stacks_path }}/caddy/config"
    podman_service_templates:
      - src: Caddyfile.j2
        dest: "{{ stacks_path }}/caddy/Caddyfile"
        mode: "0644"
      - src: caddy.env.j2
        dest: "{{ stacks_path }}/caddy/caddy.env"
        mode: "0600"
        no_log: true
    podman_service_quadlets: ["caddy.container"]
    podman_service_units: ["caddy.socket"]
    podman_service_units_start:
      - caddy.socket
      - caddy.service
    podman_service_changed_extra: "{{ (caddy_containerfile is changed) or (caddy_image_build is changed) }}"
