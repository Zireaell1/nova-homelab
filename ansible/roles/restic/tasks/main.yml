---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ restic_data_path }}"

- name: Upload .network file
  ansible.builtin.template:
    src: "restic.network.j2"
    dest: "{{ quadlet_path }}/restic.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart restic

- name: Upload .container file
  ansible.builtin.template:
    src: "restic.container.j2"
    dest: "{{ quadlet_path }}/restic.container"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart restic

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ restic_image }}:{{ restic_version }}"
    state: present

- name: Flush handlers to restart stack if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Ensure stack is started and enabled
  ansible.builtin.systemd:
    daemon_reload: true
    name: restic.service
    state: started
    enabled: true
    scope: user
  ignore_errors: "{{ ansible_check_mode }}"
