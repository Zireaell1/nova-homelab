---
- name: Deploy Loki
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: loki
    podman_service_dirs:
      - "{{ monitoring_path }}/loki"
      - "{{ monitoring_path }}/loki/data"
    podman_service_templates:
      - src: loki.yaml.j2
        dest: "{{ monitoring_path }}/loki/loki.yaml"
    podman_service_quadlets: ["loki.container"]
    podman_service_images: ["{{ loki_image }}:{{ loki_version }}"]
