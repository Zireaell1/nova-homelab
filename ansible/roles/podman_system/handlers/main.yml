---
- name: Reload systemd daemon and warn about required reboot
  ansible.builtin.systemd:
    daemon_reload: true

- name: Show cgroup delegation restart warning
  ansible.builtin.debug:
    msg: >
      [WARNING] cgroup controllers (cpu cpuset io memory pids) were just delegated
      to user sessions. This only takes effect for NEW user@.service instances.
      Reboot the server, or fully log out {{ ansible_user }} including
      user@$(id -u {{ ansible_user }}).service, before CPUWeight= and rootless
      Podman blkio stats take effect.
  listen: Reload systemd daemon and warn about required reboot

- name: Restore container path SELinux contexts
  ansible.builtin.command: "restorecon -R -F {{ item }}"
  loop: "{{ podman_system_container_paths }}"
  changed_when: true
