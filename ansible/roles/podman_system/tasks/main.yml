---
- name: Install Podman
  ansible.builtin.dnf:
    name:
      - podman
      - prometheus-podman-exporter
    state: present

- name: Enable lingering for current user
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

# Default: false
- name: Allow containers to use host hardware devices (SELinux)
  ansible.posix.seboolean:
    name: container_use_devices
    state: true
    persistent: true

- name: Ensure user@.service systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Delegate io cgroup controller to user sessions (required for rootless blkio stats)
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Delegate=cpu cpuset io memory pids
  notify: Reload systemd daemon and warn about required reboot
