---
- name: Verify Grafana static directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ monitoring_path }}/grafana"
    - "{{ monitoring_path }}/grafana/provisioning"
    - "{{ monitoring_path }}/grafana/provisioning/dashboards"

- name: Sync dashboard files
  ansible.posix.synchronize:
    src: "files/dashboards/"
    dest: "{{ monitoring_path }}/grafana/provisioning/dashboards/"
    delete: true
    archive: true
    owner: false
    group: false
    rsync_opts:
      - "--exclude=dashboards.yml"
      - "--chmod=D0755,F0644"
      - "--chown={{ ansible_user }}:{{ ansible_user }}"
  register: grafana_sync_dashboards

- name: Deploy Grafana
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: grafana
    podman_service_dirs:
      - "{{ monitoring_path }}/grafana"
      - "{{ monitoring_path }}/grafana/provisioning"
      - "{{ monitoring_path }}/grafana/provisioning/datasources"
      - "{{ monitoring_path }}/grafana/provisioning/dashboards"
      - "{{ monitoring_path }}/grafana/provisioning/alerting"
      - "{{ monitoring_path }}/grafana/provisioning/plugins"
      - "{{ monitoring_path }}/grafana/data"
    podman_service_templates:
      - src: grafana.env.j2
        dest: "{{ monitoring_path }}/grafana/grafana.env"
        mode: "0644"
      - src: grafana.secrets.env.j2
        dest: "{{ monitoring_path }}/grafana/grafana.secrets.env"
        mode: "0600"
        no_log: true
      - src: datasources.yml.j2
        dest: "{{ monitoring_path }}/grafana/provisioning/datasources/datasources.yml"
        mode: "0644"
      - src: alerting.yml.j2
        dest: "{{ monitoring_path }}/grafana/provisioning/alerting/alerting.yml"
        mode: "0644"
      - src: contact-points.yml.j2
        dest: "{{ monitoring_path }}/grafana/provisioning/alerting/contact-points.yml"
        mode: "0644"
      - src: dashboards.yml.j2
        dest: "{{ monitoring_path }}/grafana/provisioning/dashboards/dashboards.yml"
        mode: "0644"
    podman_service_quadlets: ["grafana.container"]
    podman_service_images: ["{{ grafana_image }}:{{ grafana_version }}"]
    podman_service_changed_extra: "{{ grafana_sync_dashboards is changed }}"
