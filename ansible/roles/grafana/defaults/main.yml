---
grafana_memory_limit: "2g"

grafana_frigate_detector_slow_seconds: 0.02

grafana_admin_username: "{{ homelab_user }}"

# https://hub.docker.com/r/grafana/grafana/
grafana_image: "docker.io/grafana/grafana"

# renovate: datasource=docker depName=docker.io/grafana/grafana
grafana_version: "13.3.0"

# The community dashboard, pinned to a commit of its repo (Renovate follows master, monthly).
# The sha256 is of node-exporter-full.json at that commit: on a Renovate PR, CI prints the new one.
# renovate-git: depName=rfmoz/grafana-dashboards packageName=https://github.com/rfmoz/grafana-dashboards branch=master
grafana_node_exporter_full_commit: "99a25cc154c21c4fcbae1aa24352bf1b6764d847"
grafana_node_exporter_full_sha256: "dfea296a1e210aa668197614d3708b56718a99be7794a1c2c012cd51da7ecb89"
