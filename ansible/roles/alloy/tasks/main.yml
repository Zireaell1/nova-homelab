---
- name: Include OS-specific installation tasks
  ansible.builtin.include_tasks: "install_{{ ansible_os_family }}.yml"

- name: Add alloy user to systemd-journal group
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: "{{ alloy_config_template }}"
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0600"
  notify: Restart alloy

- name: Ensure custom metrics directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "alloy"
    mode: "0775"
  loop:
    - "/opt/alloy-metrics"

- name: Smartmon block
  when: alloy_enable_smartmon
  block:
    - name: Deploy smartmon script
      ansible.builtin.copy:
        src: smartmon.sh
        dest: /usr/local/bin/smartmon.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy smartmon systemd service
      ansible.builtin.template:
        src: smartmon.service.j2
        dest: /etc/systemd/system/smartmon.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy smartmon systemd timer
      ansible.builtin.template:
        src: smartmon.timer.j2
        dest: /etc/systemd/system/smartmon.timer
        owner: root
        group: root
        mode: "0644"

    - name: Ensure smartmon timer is enabled and running
      ansible.builtin.systemd:
        name: smartmon.timer
        state: started
        enabled: true
        daemon_reload: true

- name: Flush handlers to restart Alloy if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Ensure Alloy is enabled and running
  ansible.builtin.systemd:
    name: alloy.service
    state: started
    enabled: true
