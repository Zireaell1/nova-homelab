---
- name: Include OS-specific installation tasks
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] }}.yml"

- name: Add alloy user to systemd-journal group
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: "{{ alloy_config_template }}"
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Ensure custom metrics directory exists
  ansible.builtin.file:
    path: "{{ textfile_metrics_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "alloy"
    mode: "0775"

- name: Smartmon block
  when: alloy_enable_smartmon
  block:
    - name: Install smartmontools
      ansible.builtin.package:
        name: smartmontools
        state: present

    - name: Deploy smartmon script
      ansible.builtin.copy:
        src: smartmon.sh
        dest: /usr/local/bin/smartmon.sh
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartmon service

    - name: Deploy smartmon daemon wrapper
      ansible.builtin.template:
        src: smartmon_daemon.sh.j2
        dest: /usr/local/bin/smartmon_daemon.sh
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartmon service

    - name: Deploy smartmon systemd service
      ansible.builtin.template:
        src: smartmon.service.j2
        dest: /etc/systemd/system/smartmon.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart smartmon service

    - name: Deploy smartd configuration (self-test schedule)
      ansible.builtin.template:
        src: smartd.conf.j2
        dest: "{{ alloy_smartd_conf_path }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart smartd

- name: Intel GPU metrics block
  when: alloy_enable_intel_gpu
  block:
    - name: Install igt-gpu-tools (intel_gpu_top)
      ansible.builtin.package:
        name: igt-gpu-tools
        state: present

    - name: Deploy Intel GPU metrics script
      ansible.builtin.copy:
        src: intel_gpu_metrics.py
        dest: /usr/local/bin/intel_gpu_metrics.py
        owner: root
        group: root
        mode: "0644"
      notify: Restart intel gpu metrics service

    - name: Deploy Intel GPU metrics systemd service
      ansible.builtin.template:
        src: intel-gpu-metrics.service.j2
        dest: /etc/systemd/system/intel-gpu-metrics.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart intel gpu metrics service

- name: Intel NPU metrics block
  when: alloy_enable_intel_npu
  block:
    - name: Deploy Intel NPU metrics script
      ansible.builtin.copy:
        src: intel_npu_metrics.sh
        dest: /usr/local/bin/intel_npu_metrics.sh
        owner: root
        group: root
        mode: "0755"
      notify: Restart intel npu metrics service

    - name: Deploy Intel NPU metrics systemd service
      ansible.builtin.template:
        src: intel-npu-metrics.service.j2
        dest: /etc/systemd/system/intel-npu-metrics.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart intel npu metrics service

- name: Modem metrics block
  when: alloy_enable_modem_metrics
  block:
    - name: Deploy the modem collector
      ansible.builtin.copy:
        src: modem_metrics.py
        dest: /usr/local/bin/modem_metrics.py
        owner: root
        group: root
        mode: "0755"
      notify: Restart modem metrics service

    - name: Deploy modem-pause
      ansible.builtin.template:
        src: modem-pause.sh.j2
        dest: /usr/local/bin/modem-pause
        owner: root
        group: root
        mode: "0755"
        validate: "bash -n %s"

    - name: Create the credentials directory
      ansible.builtin.file:
        path: /etc/homelab
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy the modem password
      ansible.builtin.copy:
        content: "{{ vault_modem_admin_password }}"
        dest: /etc/homelab/modem-password
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart modem metrics service

    - name: Deploy the modem metrics systemd service
      ansible.builtin.template:
        src: modem-metrics.service.j2
        dest: /etc/systemd/system/modem-metrics.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart modem metrics service

- name: Updates collector block
  when: alloy_enable_updates
  block:
    - name: Install packages the updates collector needs
      ansible.builtin.package:
        name: "{{ alloy_updates_packages[ansible_facts['os_family']] }}"
        state: present
      when: alloy_updates_packages[ansible_facts['os_family']] | length > 0

    - name: Refresh apt package lists daily without upgrading (Debian)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99homelab-periodic
        owner: root
        group: root
        mode: "0644"
        content: |
          // Managed by Ansible
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "0";
          APT::Update::Post-Invoke-Success { "mkdir -p /var/lib/apt/periodic && touch /var/lib/apt/periodic/update-success-stamp || true"; };
      when: ansible_facts['os_family'] == 'Debian'

    - name: Deploy updates collector script
      ansible.builtin.template:
        src: "updates_{{ ansible_facts['os_family'] }}.sh.j2"
        dest: /usr/local/bin/homelab-updates.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy updates collector systemd service
      ansible.builtin.template:
        src: updates.service.j2
        dest: /etc/systemd/system/homelab-updates.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart updates timer

    - name: Deploy updates collector systemd timer
      ansible.builtin.template:
        src: updates.timer.j2
        dest: /etc/systemd/system/homelab-updates.timer
        owner: root
        group: root
        mode: "0644"
      notify: Restart updates timer

- name: Boot metrics block
  when: alloy_enable_boot_metrics
  block:
    - name: Deploy boot metrics script
      ansible.builtin.template:
        src: boot_metrics.sh.j2
        dest: /usr/local/bin/homelab-boot-metrics.sh
        owner: root
        group: root
        mode: "0755"
        validate: "bash -n %s"
      notify: Restart boot metrics timer

    - name: Deploy boot metrics service and timer
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: boot-metrics.service.j2, dest: homelab-boot-metrics.service }
        - { src: boot-metrics.timer.j2, dest: homelab-boot-metrics.timer }
      loop_control:
        label: "{{ item.dest }}"
      notify: Restart boot metrics timer

- name: Flush handlers to restart Alloy if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Ensure smartmon daemon is enabled and running
  ansible.builtin.systemd:
    name: smartmon.service
    state: started
    enabled: true
  when: alloy_enable_smartmon
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure Intel GPU metrics service is enabled and running
  ansible.builtin.systemd:
    name: intel-gpu-metrics.service
    state: started
    enabled: true
  when: alloy_enable_intel_gpu
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure Intel NPU metrics service is enabled and running
  ansible.builtin.systemd:
    name: intel-npu-metrics.service
    state: started
    enabled: true
  when: alloy_enable_intel_npu
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure the modem metrics service is enabled and running
  ansible.builtin.systemd:
    name: modem-metrics.service
    state: started
    enabled: true
    daemon_reload: true
  when: alloy_enable_modem_metrics
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure smartd is enabled and running
  ansible.builtin.systemd:
    name: smartd.service
    state: started
    enabled: true
  when: alloy_enable_smartmon
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure Alloy is enabled and running
  ansible.builtin.systemd:
    name: alloy.service
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
