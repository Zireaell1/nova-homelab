---
- name: Include OS-specific installation tasks
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] }}.yml"

- name: Add alloy user to systemd-journal group
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: "{{ alloy_config_template }}"
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Ensure custom metrics directory exists
  ansible.builtin.file:
    path: "{{ textfile_metrics_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "alloy"
    mode: "0775"

- name: Smartmon block
  when: alloy_enable_smartmon
  block:
    - name: Install smartmontools
      ansible.builtin.package:
        name: smartmontools
        state: present

    - name: Deploy smartmon script
      ansible.builtin.copy:
        src: smartmon.sh
        dest: /usr/local/bin/smartmon.sh
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartmon service

    - name: Deploy smartmon daemon wrapper
      ansible.builtin.template:
        src: smartmon_daemon.sh.j2
        dest: /usr/local/bin/smartmon_daemon.sh
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartmon service

    - name: Deploy smartmon systemd service
      ansible.builtin.template:
        src: smartmon.service.j2
        dest: /etc/systemd/system/smartmon.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart smartmon service

- name: Updates collector block
  when: alloy_enable_updates
  block:
    - name: Install packages the updates collector needs
      ansible.builtin.package:
        name: "{{ alloy_updates_packages[ansible_facts['os_family']] }}"
        state: present
      when: alloy_updates_packages[ansible_facts['os_family']] | length > 0

    - name: Refresh apt package lists daily without upgrading (Debian)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99homelab-periodic
        owner: root
        group: root
        mode: "0644"
        content: |
          // Managed by Ansible
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "0";
          APT::Update::Post-Invoke-Success { "mkdir -p /var/lib/apt/periodic && touch /var/lib/apt/periodic/update-success-stamp || true"; };
      when: ansible_facts['os_family'] == 'Debian'

    - name: Deploy updates collector script
      ansible.builtin.template:
        src: "updates_{{ ansible_facts['os_family'] }}.sh.j2"
        dest: /usr/local/bin/homelab-updates.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy updates collector systemd service
      ansible.builtin.template:
        src: updates.service.j2
        dest: /etc/systemd/system/homelab-updates.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart updates timer

    - name: Deploy updates collector systemd timer
      ansible.builtin.template:
        src: updates.timer.j2
        dest: /etc/systemd/system/homelab-updates.timer
        owner: root
        group: root
        mode: "0644"
      notify: Restart updates timer

- name: Boot metrics block
  when: alloy_enable_boot_metrics
  block:
    - name: Deploy boot metrics script
      ansible.builtin.template:
        src: boot_metrics.sh.j2
        dest: /usr/local/bin/homelab-boot-metrics.sh
        owner: root
        group: root
        mode: "0755"
        validate: "bash -n %s"
      notify: Restart boot metrics timer

    - name: Deploy boot metrics service and timer
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: boot-metrics.service.j2, dest: homelab-boot-metrics.service }
        - { src: boot-metrics.timer.j2, dest: homelab-boot-metrics.timer }
      loop_control:
        label: "{{ item.dest }}"
      notify: Restart boot metrics timer

- name: Flush handlers to restart Alloy if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Ensure smartmon daemon is enabled and running
  ansible.builtin.systemd:
    name: smartmon.service
    state: started
    enabled: true
  when: alloy_enable_smartmon
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure Alloy is enabled and running
  ansible.builtin.systemd:
    name: alloy.service
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
