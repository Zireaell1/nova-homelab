---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
    owner: root
    group: root

- name: Add Grafana package repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Configure Alloy environment variables
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^#?\s*CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting --server.http.listen-addr=0.0.0.0:12345"'
    state: present
    owner: root
    group: root
    mode: "0644"
    create: true
  notify: Restart alloy

- name: Deploy Alloy authentication secrets
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/alloy/{{ item.filename }}"
    owner: root
    group: alloy
    mode: "0600"
  loop:
    - filename: prom_password.txt
      content: "{{ vault_prometheus_service_account_password }}"
    - filename: loki_password.txt
      content: "{{ vault_loki_service_account_password }}"
  no_log: true
