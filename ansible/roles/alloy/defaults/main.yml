---
alloy_smartmon_interval_seconds: 300

alloy_enable_updates: true

alloy_enable_boot_metrics: true

alloy_enable_intel_gpu: false

alloy_intel_gpu_interval_seconds: 15

alloy_updates_packages:
  RedHat:
    - dnf5-plugins
    - python3
  Debian: []

alloy_updates_on_calendar: "*-*-* 06:00:00"

alloy_smartd_conf_path: /etc/smartmontools/smartd.conf

alloy_smartd_device_overrides: []
