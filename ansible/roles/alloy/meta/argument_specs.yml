---
argument_specs:
  main:
    short_description: Grafana Alloy with host collectors and textfile scripts
    description:
      - Root plane. Installs Alloy, deploys the per-host config, and optionally the
        smartmon, smartd self-test, pending-updates and boot-timing collectors.
    options:
      alloy_config_template:
        type: str
        required: true
        choices: [config_nova.alloy.j2, config_orion.alloy.j2]
        description: Per-host Alloy config under templates/. Set in host_vars.
      alloy_enable_smartmon:
        type: bool
        required: true
        description: Deploy smartmontools, smartmon.sh and its service. Set in host_vars.
      alloy_smartmon_interval_seconds:
        type: int
        default: 300
        description: Seconds between smartmon.sh runs.
      alloy_enable_updates:
        type: bool
        default: true
        description: Deploy the pending-updates collector and its daily timer.
      alloy_updates_packages:
        type: dict
        default: { RedHat: [dnf5-plugins, python3], Debian: [] }
        description: Extra packages the updates collector needs, keyed by ansible_facts['os_family'].
      alloy_updates_on_calendar:
        type: str
        default: "*-*-* 06:00:00"
        description: systemd OnCalendar= for homelab-updates.timer.
      alloy_enable_boot_metrics:
        type: bool
        default: true
        description: Deploy the boot-timing collector and its once-per-boot timer.
      alloy_smartd_conf_path:
        type: str
        default: /etc/smartmontools/smartd.conf
        description: Where smartd reads its config (Fedora path; the block runs on Nova only).
      alloy_smartd_device_overrides:
        type: list
        elements: dict
        default: []
        description: Per-device smartd lines (device by-id path + directives) placed before DEVICESCAN.
        options:
          device: { type: str, required: true }
          directives: { type: str, required: true }
