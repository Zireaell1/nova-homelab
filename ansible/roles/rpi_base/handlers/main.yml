---
- name: Abort playbook if SPI was just enabled (manual reboot required)
  ansible.builtin.fail:
    msg: >
      SPI was just enabled in /boot/firmware/config.txt!
      The Raspberry Pi requires a full system reboot to load the spidev hardware drivers.
      Please reboot the Pi manually ('sudo reboot') and re-run this playbook.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Abort playbook if device group membership changed (manual reboot required)
  ansible.builtin.fail:
    msg: >
      {{ ansible_user }} was just added to the spi/gpio groups.
      The running systemd user manager still holds the old supplementary group set,
      so eink-display.service would start without access to /dev/spidev* and /dev/gpiochip*.
      Neither a new SSH session nor 'meta: reset_connection' refreshes it once lingering
      is enabled. Please reboot the Pi manually ('sudo reboot') and re-run this playbook.
  ignore_errors: "{{ ansible_check_mode }}"
