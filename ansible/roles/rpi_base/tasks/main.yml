---
- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - python3-packaging
      - python3-debian
      - git
      - swig
      - liblgpio-dev
      - pipx
      - gpg
    state: present
    update_cache: true

- name: Ensure the service user can reach SPI and GPIO
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - spi
      - gpio
    append: true
  notify: Abort playbook if device group membership changed (manual reboot required)

- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ user_units_path }}"
      mode: "0755"

    - path: "{{ user_bin_path }}"
      mode: "0755"

- name: Enable lingering for current user
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Detect the cloud-init user-data written by Imager
  ansible.builtin.stat:
    path: /boot/firmware/user-data
  register: rpi_base_cloud_init_userdata

- name: Stop cloud-init from rewriting /etc/hosts wholesale
  ansible.builtin.lineinfile:
    path: /boot/firmware/user-data
    regexp: "^manage_etc_hosts:"
    line: "manage_etc_hosts: localhost"
    state: present
  when: rpi_base_cloud_init_userdata.stat.exists

- name: Provide static DNS entries in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*\b{{ item }}\.{{ vault_domain }}$'
    line: "{{ vault_primary_ip }} {{ item }}.{{ vault_domain }}"
    state: present
  loop: "{{ rpi_base_static_hosts }}"

- name: Enable SPI interface
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^#?dtparam=spi="
    line: "dtparam=spi=on"
    state: present
  notify: Abort playbook if SPI was just enabled (manual reboot required)

- name: Keep NetworkManager retrying wifi and disable wifi power saving
  ansible.builtin.copy:
    src: 90-orion-wifi.conf
    dest: /etc/NetworkManager/conf.d/90-orion-wifi.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetworkManager

- name: No login banner (Debian's motd text and uname line)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
    replace: '# \1'
  loop:
    - /etc/pam.d/sshd
    - /etc/pam.d/login

- name: Install the wifi watchdog script
  ansible.builtin.template:
    src: wifi-watchdog.sh.j2
    dest: /usr/local/sbin/wifi-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Install the wifi watchdog and nightly reboot units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wifi-watchdog.service
    - wifi-watchdog.timer
    - reboot-if-required.service
    - reboot-if-required.timer

- name: Enable the wifi watchdog and nightly reboot timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - wifi-watchdog.timer
    - reboot-if-required.timer
  ignore_errors: "{{ ansible_check_mode }}"

- name: Flush rpi_base handlers
  ansible.builtin.meta: flush_handlers
