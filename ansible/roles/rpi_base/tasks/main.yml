---
- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - python3-packaging
      - python3-debian
      - git
      - swig
      - liblgpio-dev
      - pipx
      - gpg
    state: present
    update_cache: true

- name: Ensure the service user can reach SPI and GPIO
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - spi
      - gpio
    append: true
  notify: Abort playbook if device group membership changed (manual reboot required)

- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ user_units_path }}"
      mode: "0755"

    - path: "{{ user_bin_path }}"
      mode: "0755"

- name: Enable lingering for current user
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Detect cloud-init's /etc/hosts template
  ansible.builtin.stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: rpi_base_cloud_hosts_template

- name: Keep the static DNS entries in cloud-init's /etc/hosts template
  ansible.builtin.blockinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    marker: "# {mark} static DNS entries (Ansible, rpi_base)"
    block: |
      {% for item in rpi_base_static_hosts %}
      {{ vault_primary_ip }} {{ item }}.{{ vault_domain }}
      {% endfor %}
  when: rpi_base_cloud_hosts_template.stat.exists

- name: Provide static DNS entries in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*\b{{ item }}\.{{ vault_domain }}$'
    line: "{{ vault_primary_ip }} {{ item }}.{{ vault_domain }}"
    state: present
  loop: "{{ rpi_base_static_hosts }}"

- name: Enable SPI interface
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^#?dtparam=spi="
    line: "dtparam=spi=on"
    state: present
  notify: Abort playbook if SPI was just enabled (manual reboot required)

- name: Keep NetworkManager retrying wifi and disable wifi power saving
  ansible.builtin.copy:
    src: 90-orion-wifi.conf
    dest: /etc/NetworkManager/conf.d/90-orion-wifi.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetworkManager

- name: No login banner (Debian's motd text and uname line)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
    replace: '# \1'
  loop:
    - /etc/pam.d/sshd
    - /etc/pam.d/login

- name: Install the wifi watchdog script
  ansible.builtin.template:
    src: wifi-watchdog.sh.j2
    dest: /usr/local/sbin/wifi-watchdog
    owner: root
    group: root
    mode: "0755"
  register: rpi_base_watchdog_script

# The watchdog used to run from a per-minute timer; it's a loop service now.
- name: Stop and disable the old wifi watchdog timer
  ansible.builtin.systemd:
    name: wifi-watchdog.timer
    state: stopped
    enabled: false
  register: rpi_base_old_watchdog_timer
  failed_when:
    - rpi_base_old_watchdog_timer is failed
    - "'Could not find the requested service' not in (rpi_base_old_watchdog_timer.msg | default(''))"

- name: Remove the old wifi watchdog timer
  ansible.builtin.file:
    path: /etc/systemd/system/wifi-watchdog.timer
    state: absent

- name: Install the wifi watchdog unit
  ansible.builtin.copy:
    src: wifi-watchdog.service
    dest: /etc/systemd/system/wifi-watchdog.service
    owner: root
    group: root
    mode: "0644"
  register: rpi_base_watchdog_unit

- name: Install the nightly reboot units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - reboot-if-required.service
    - reboot-if-required.timer

- name: Run the wifi watchdog
  ansible.builtin.systemd:
    name: wifi-watchdog.service
    enabled: true
    state: "{{ 'restarted' if (rpi_base_watchdog_script is changed or rpi_base_watchdog_unit is changed) else 'started' }}"
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable the nightly reboot timer
  ansible.builtin.systemd:
    name: reboot-if-required.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
