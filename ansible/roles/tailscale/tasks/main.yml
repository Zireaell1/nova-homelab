---
# https://pkgs.tailscale.com/stable/fedora/tailscale.repo
- name: Add Tailscale package repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    file: tailscale
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    enabled: true
    sslverify: true

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled daemon is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check current Tailscale connection status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  check_mode: false
  failed_when: false

- name: Authenticate and register node (First run only)
  ansible.builtin.command: >
    tailscale up
    --authkey={{ vault_tailscale_auth_key }}
    --advertise-routes={{ primary_ip }}/32
    --advertise-tags=tag:homelab
    --accept-dns=false
    --reset
  when: "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"
  changed_when: true
