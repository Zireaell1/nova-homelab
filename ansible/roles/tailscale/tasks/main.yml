---
# https://pkgs.tailscale.com/stable/fedora/tailscale.repo
- name: Add Tailscale package repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    file: tailscale
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    enabled: true
    sslverify: true
    priority: "10"

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
    update_cache: true

- name: Opt out of Tailscale's client log upload
  ansible.builtin.lineinfile:
    path: /etc/default/tailscaled
    regexp: "^#?\\s*TS_NO_LOGS_NO_SUPPORT="
    line: "TS_NO_LOGS_NO_SUPPORT=true"
    create: true
    owner: root
    group: root
    mode: "0644"
  register: tailscale_env_file

- name: Ensure tailscaled daemon is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    state: "{{ 'restarted' if tailscale_env_file is changed else 'started' }}"
    enabled: true

- name: Read Tailscale state
  ansible.builtin.command: tailscale status --json --peers=false
  register: tailscale_status_raw
  changed_when: false
  check_mode: false
  failed_when: false

- name: Log in to the tailnet (first run, or after a logout)
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ vault_tailscale_auth_key }}
    --advertise-tags={{ tailscale_advertise_tags | join(',') }}
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --reset
  when: >-
    tailscale_status_raw.rc != 0
    or (tailscale_status_raw.stdout | from_json).BackendState == 'NeedsLogin'
  changed_when: true
  no_log: true

- name: Read Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs_raw
  changed_when: false
  check_mode: false

- name: Apply Tailscale preferences
  ansible.builtin.command: >-
    tailscale set
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --accept-dns={{ tailscale_accept_dns | lower }}
    --auto-update={{ tailscale_auto_update | lower }}
  vars:
    tailscale_prefs: "{{ tailscale_prefs_raw.stdout | from_json }}"
  when: >-
    (tailscale_prefs.AdvertiseRoutes | default([], true) | sort) != (tailscale_advertise_routes | sort)
    or (tailscale_prefs.CorpDNS | bool) != (tailscale_accept_dns | bool)
    or ((tailscale_prefs.AutoUpdate | default({})).Apply | default(false, true) | bool) != (tailscale_auto_update | bool)
  changed_when: true
