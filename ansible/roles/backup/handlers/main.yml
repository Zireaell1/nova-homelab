---
- name: Restart homelab-backup timer
  ansible.builtin.systemd:
    name: homelab-backup.timer
    scope: user
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart homelab-verify-backup timer
  ansible.builtin.systemd:
    name: homelab-verify-backup.timer
    scope: user
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart device-backup-freshness timer
  ansible.builtin.systemd:
    name: device-backup-freshness.timer
    scope: user
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
