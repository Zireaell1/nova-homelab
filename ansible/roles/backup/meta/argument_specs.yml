---
argument_specs:
  main:
    short_description: Nightly restic backup, B2 sync, verification and freshness collectors
    description:
      - Rootless plane. Runs after every service it quiesces, since backup_targets with
        stop set to true must resolve to deployed quadlets.
    options:
      backup_targets:
        type: list
        elements: dict
        required: true
        description: What to back up. Defined in group_vars/all/backup.yml.
        options:
          name:
            type: str
            required: true
            description: Target name; with stop set to true it must match a <name>.container quadlet.
          paths:
            type: list
            elements: path
            required: true
          excludes:
            type: list
            elements: path
            default: []
          stop:
            type: bool
            default: false
            description: Stop the unit for a consistent snapshot, restart it afterwards.
      backup_rclone_remote_name:
        type: str
        default: external
      backup_rclone_target:
        type: str
        default: "{{ backup_rclone_remote_name }}:{{ vault_backup_rclone_bucket_name }}"
      backup_restic_password_file:
        type: path
        default: "{{ user_config_path }}/restic/.repo_pass"
      backup_b2_quota_bytes:
        type: int
        default: 9000000000
        description: Cloud sync is skipped when the projected size exceeds this.
      backup_escrow_vault:
        type: path
        description: Encrypted Ansible Vault on the controller, copied as ciphertext into ansible_escrow_dir.
      backup_canary_file:
        type: path
        default: "{{ user_backups_path }}/canary.txt"
      backup_canary_max_age:
        type: int
        default: 172800
        description: Seconds; older restored canary fails verification.
      backup_b2_hard_delete:
        type: bool
        default: true
        description: rclone deletes on B2 for good. Set false only after the bucket has a lifecycle rule that keeps prior versions for N days.
      backup_rclone_max_delete_percent:
        type: int
        default: 25
        description: A sync may delete at most this share of the local repository size (rclone --max-delete-size); more fails the sync.
      backup_rclone_max_delete_min_bytes:
        type: int
        default: 1073741824
        description: Floor for the delete limit, so a small repository can still prune.
      backup_rclone_retries:
        type: int
        default: 5
        description: rclone --retries for the B2 sync (survives a short modem reboot).
      backup_rclone_retries_sleep:
        type: str
        default: "2m"
        description: rclone --retries-sleep between those retries.
      backup_verify_b2_check_weekday:
        type: int
        default: 7
        description: Day of the week (1 = Monday, 7 = Sunday) the verify also runs restic check against B2; 0 disables it.
      backup_verify_b2_read_subset:
        type: str
        default: "5%"
        description: restic check --read-data-subset for that weekly B2 check (B2 download is free up to 3x the stored size a month).
