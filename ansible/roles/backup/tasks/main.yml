---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ backup_repo_critical }}"

- name: Ensure rclone config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/rclone"
    state: directory
    mode: "0755"
  no_log: true

- name: Generate rclone configuration file
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "/home/{{ ansible_user }}/.config/rclone/rclone.conf"
    mode: "0600"

- name: Check if CRITICAL repository is already initialized
  ansible.builtin.command: restic snapshots
  environment:
    RESTIC_PASSWORD: "{{ vault_backup_restic_password }}"
    RESTIC_REPOSITORY: "{{ backup_repo_critical }}"
  register: backup_restic_critical_check
  failed_when: false
  changed_when: false

- name: Initialize CRITICAL repository
  ansible.builtin.command: restic init
  environment:
    RESTIC_PASSWORD: "{{ vault_backup_restic_password }}"
    RESTIC_REPOSITORY: "{{ backup_repo_critical }}"
  when: backup_restic_critical_check.rc != 0
  changed_when: true

- name: Generate backup script from Jinja2 template (with Bash validation)
  ansible.builtin.template:
    src: homelab-backup.sh.j2
    dest: "/home/{{ ansible_user }}/.local/bin/homelab-backup.sh"
    mode: "0700"
    validate: "bash -n %s"

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "homelab-backup.service.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/homelab-backup.service"
    mode: "0644"

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "homelab-backup.timer.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/homelab-backup.timer"
    mode: "0644"

- name: Enable and start the Timer
  ansible.builtin.systemd:
    name: homelab-backup.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
