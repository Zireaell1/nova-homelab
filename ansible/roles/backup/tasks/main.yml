---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  loop:
    - "{{ backup_repo_critical }}"
    - "{{ user_home }}/backups"
    - "{{ user_home }}/backups/git_repos"
    - "{{ user_home }}/.config/rclone"
    - "{{ user_home }}/.config/restic"

- name: Deploy Restic password
  ansible.builtin.copy:
    content: "{{ vault_backup_restic_password }}"
    dest: "{{ backup_restic_password_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: Generate rclone configuration file
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ user_home }}/.config/rclone/rclone.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: Check if CRITICAL repository is already initialized
  ansible.builtin.command: restic snapshots
  environment:
    RESTIC_PASSWORD_FILE: "{{ backup_restic_password_file }}"
    RESTIC_REPOSITORY: "{{ backup_repo_critical }}"
  register: backup_restic_critical_check
  failed_when: false
  changed_when: false

- name: Initialize CRITICAL repository
  ansible.builtin.command: restic init
  environment:
    RESTIC_PASSWORD_FILE: "{{ backup_restic_password_file }}"
    RESTIC_REPOSITORY: "{{ backup_repo_critical }}"
  when: backup_restic_critical_check.rc != 0
  changed_when: true

- name: Generate Git sync script
  ansible.builtin.template:
    src: git-sync.sh.j2
    dest: "{{ user_bin_path }}/git-sync.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
    validate: "bash -n %s"

- name: Generate backup script from Jinja2 template (with Bash validation)
  ansible.builtin.template:
    src: homelab-backup.sh.j2
    dest: "{{ user_bin_path }}/homelab-backup.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
    validate: "bash -n %s"

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "homelab-backup.service.j2"
    dest: "{{ user_units_path }}/homelab-backup.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart homelab-backup timer

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "homelab-backup.timer.j2"
    dest: "{{ user_units_path }}/homelab-backup.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart homelab-backup timer

- name: Generate verify script from Jinja2 template (with Bash validation)
  ansible.builtin.template:
    src: "homelab-verify-backup.sh.j2"
    dest: "{{ user_bin_path }}/homelab-verify-backup.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
    validate: "bash -n %s"

- name: Deploy Verify Systemd Service file
  ansible.builtin.template:
    src: "homelab-verify-backup.service.j2"
    dest: "{{ user_units_path }}/homelab-verify-backup.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart homelab-verify-backup timer

- name: Deploy Verify Systemd Timer file
  ansible.builtin.template:
    src: "homelab-verify-backup.timer.j2"
    dest: "{{ user_units_path }}/homelab-verify-backup.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart homelab-verify-backup timer

- name: Flush handlers to restart Timers if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - homelab-backup.timer
    - homelab-verify-backup.timer
  ignore_errors: "{{ ansible_check_mode }}"
