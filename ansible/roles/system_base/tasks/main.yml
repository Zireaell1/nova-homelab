- name: Software install
  ansible.builtin.dnf:
    name:
      - fish
      - fastfetch
      - micro
      - restic
      - bat
      - cockpit
      - cockpit-storaged
      - cockpit-networkmanager
      - cockpit-podman
      - cockpit-selinux
      - rsync
      - rclone
      - python3
      - git
      - jq
      - smartmontools
    state: present

- name: Remove Cockpit MOTD/issue banner
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/motd.d/cockpit
    - /etc/issue.d/cockpit.issue

- name: Check current version of Zellij
  ansible.builtin.command: zellij --version
  register: system_base_zellij_cmd_output
  failed_when: false
  check_mode: false
  changed_when: false

- name: Install Zellij from GitHub repo
  ansible.builtin.unarchive:
    src: "{{ system_base_zellij_link }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: system_base_zellij_cmd_output.rc != 0 or system_base_zellij_version not in system_base_zellij_cmd_output.stdout

- name: Verify if group exists
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - render
    - dialout

- name: Ensure rgb system group exists with a stable GID
  ansible.builtin.group:
    name: rgb
    gid: "480"
    system: true
    state: present
  notify: Retrigger rgb devices

- name: Assign user to groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - render
    - dialout
    - rgb

- name: Reset SSH connection to apply group changes
  ansible.builtin.meta: reset_connection

- name: Change default shell to Fish
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ system_base_shell }}"

- name: Upload custom Udev rules for ASRock RGB
  ansible.builtin.template:
    src: "asrock-rgb.rules.j2"
    dest: "/etc/udev/rules.d/99-asrock-rgb.rules"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload Udev rules
    - Retrigger rgb devices

- name: Check if Ghostty terminfo is already installed system-wide
  ansible.builtin.stat:
    path: /usr/share/terminfo/x/xterm-ghostty
  register: system_base_ghostty_terminfo_stat

- name: Ghostty terminfo system-wide install block
  when: not system_base_ghostty_terminfo_stat.stat.exists
  block:
    - name: Dump Ghostty terminfo definition from the rootless user's database
      become: false
      ansible.builtin.command: "infocmp -x xterm-ghostty"
      register: system_base_ghostty_terminfo_src
      changed_when: false
      failed_when: false

    - name: Warn if source terminfo entry isn't found for the rootless user either
      ansible.builtin.debug:
        msg: >
          [WARNING] xterm-ghostty terminfo not found for {{ ansible_user }} either.
          SSH into the host at least once with Ghostty as {{ ansible_user }} so its
          shell integration installs the entry, then re-run this role.
      when: system_base_ghostty_terminfo_src.rc != 0

    - name: Compile and install Ghostty terminfo into /usr/share/terminfo (all users)
      ansible.builtin.command: "tic -x -o /usr/share/terminfo -"
      args:
        stdin: "{{ system_base_ghostty_terminfo_src.stdout }}"
        creates: /usr/share/terminfo/x/xterm-ghostty
      when: system_base_ghostty_terminfo_src.rc == 0
      changed_when: true
