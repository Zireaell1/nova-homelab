- name: Software install
  ansible.builtin.dnf:
    name:
      - restic
      - cockpit
      - cockpit-storaged
      - cockpit-networkmanager
      - cockpit-podman
      - cockpit-selinux
      - rsync
      - rclone
      - python3
      - git
      - jq
      - openssl
    state: present

- name: Remove Cockpit MOTD/issue banner
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/motd.d/cockpit
    - /etc/issue.d/cockpit.issue

- name: Verify if group exists
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - render
    - dialout

- name: Ensure rgb system group exists with a stable GID
  ansible.builtin.group:
    name: rgb
    gid: "480"
    system: true
    state: present

- name: Assign user to groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - render
    - dialout
    - rgb

- name: Read Ghostty terminfo from the rootless user's database
  become: false
  ansible.builtin.command: "infocmp -x xterm-ghostty"
  register: system_base_ghostty_terminfo_src
  changed_when: false
  failed_when: false

- name: Warn if the rootless user has no Ghostty terminfo
  ansible.builtin.debug:
    msg: >
      [WARNING] xterm-ghostty terminfo not found for {{ ansible_user }}.
      SSH into the host at least once with Ghostty as {{ ansible_user }} so its
      shell integration installs the entry, then re-run this role.
  when: system_base_ghostty_terminfo_src.rc != 0

- name: Read the system-wide Ghostty terminfo
  ansible.builtin.command: "infocmp -x -A /usr/share/terminfo xterm-ghostty"
  register: system_base_ghostty_terminfo_sys
  changed_when: false
  failed_when: false
  when: system_base_ghostty_terminfo_src.rc == 0

- name: Install or refresh Ghostty terminfo in /usr/share/terminfo (all users)
  ansible.builtin.command: "tic -x -o /usr/share/terminfo -"
  args:
    stdin: "{{ system_base_ghostty_terminfo_src.stdout }}"
  when:
    - system_base_ghostty_terminfo_src.rc == 0
    - system_base_ghostty_terminfo_sys.rc != 0 or
      (system_base_ghostty_terminfo_src.stdout_lines | reject('match', '#') | list) !=
      (system_base_ghostty_terminfo_sys.stdout_lines | reject('match', '#') | list)
  changed_when: true
