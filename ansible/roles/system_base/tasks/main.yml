---
- name: Disable Passim P2P sharing in fwupd config
  community.general.ini_file:
    path: /etc/fwupd/fwupd.conf
    section: fwupd
    option: P2pPolicy
    value: "nothing"
    mode: "0640"
  notify: Restart fwupd

- name: Stop, disable and mask unnecessary system services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ system_base_masked_units }}"
  register: system_base_mask
  failed_when: >-
    system_base_mask is failed
    and 'Could not find' not in (system_base_mask.msg | default(''))
    and 'not found' not in (system_base_mask.msg | default(''))

- name: Flush handlers to restart fwupd immediately
  ansible.builtin.meta: flush_handlers

