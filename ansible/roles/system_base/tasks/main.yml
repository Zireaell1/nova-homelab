---
- name: Disable Passim P2P sharing in fwupd config
  community.general.ini_file:
    path: /etc/fwupd/fwupd.conf
    section: fwupd
    option: P2pPolicy
    value: "nothing"
    mode: "0640"
  notify: Restart fwupd

- name: Remove packages this server doesn't use
  ansible.builtin.dnf:
    name: "{{ system_base_removed_packages }}"
    state: absent

- name: Stop, disable and mask unnecessary system services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ system_base_masked_units }}"
  register: system_base_mask
  failed_when: >-
    system_base_mask is failed
    and 'Could not find' not in (system_base_mask.msg | default(''))
    and 'not found' not in (system_base_mask.msg | default(''))

- name: Flush handlers to restart fwupd immediately
  ansible.builtin.meta: flush_handlers

# TODO
# cockpit-sosreport
# cockpit-files
- name: Software install
  ansible.builtin.dnf:
    name:
      - restic
      - bluez
      - cockpit
      - cockpit-storaged
      - cockpit-networkmanager
      - cockpit-podman
      - cockpit-selinux
      - rsync
      - rclone
      - python3
      - git
      - jq
      - openssl
    state: present

- name: Remove Cockpit MOTD/issue banner
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/motd.d/cockpit
    - /etc/issue.d/cockpit.issue

- name: Verify if group exists
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - render
    - dialout

- name: Ensure rgb system group exists with a stable GID
  ansible.builtin.group:
    name: rgb
    gid: "480"
    system: true
    state: present

- name: Assign user to groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - render
    - dialout
    - rgb
