---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ stacks_path }}/pihole-exporter"

- name: Upload .network file
  ansible.builtin.template:
    src: "pihole-exporter.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/pihole-exporter.network"
    mode: '0644'
  notify: Restart pihole-exporter

- name: Upload .env file
  ansible.builtin.template:
    src: "pihole-exporter.env.j2"
    dest: "{{ stacks_path }}/pihole-exporter/pihole-exporter.env"
    mode: '0600'
  no_log: true
  notify: Restart pihole-exporter

- name: Upload .container file
  ansible.builtin.template:
    src: "pihole-exporter.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/pihole-exporter.container"
    mode: '0644'
  notify: Restart pihole-exporter

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ pihole_exporter_image }}"
    state: present
