---
- name: Verify user unit and bin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ user_bin_path }}"
    - "{{ user_units_path }}"

- name: Pull latest E-Ink Dashboard app from GitHub
  ansible.builtin.git:
    repo: "{{ eink_display_repo }}"
    dest: "{{ eink_display_path }}"
    version: main
    force: true
  notify: Restart eink-display

- name: Detect the uv version currently installed for {{ ansible_user }}
  ansible.builtin.command: "{{ user_bin_path }}/uv --version"
  register: eink_display_uv_check
  changed_when: false
  failed_when: false

- name: Ensure the pinned uv is installed via pipx
  ansible.builtin.command:
    cmd: "pipx install --force uv=={{ eink_display_uv_version }}"
  vars:
    eink_display_uv_words: "{{ (eink_display_uv_check.stdout | default('', true)).split() }}"
  when: >-
    eink_display_uv_words | length < 2
    or eink_display_uv_words[1] != eink_display_uv_version
  changed_when: true

- name: Install/Sync Python dependencies using uv
  ansible.builtin.command:
    cmd: "{{ user_bin_path }}/uv sync --frozen --no-dev --extra rpi"
  args:
    chdir: "{{ eink_display_path }}"
  register: eink_display_uv_sync_result
  changed_when: >
    eink_display_uv_sync_result.stdout is search('Installing|Installed|Uninstalled|Updated') or
    eink_display_uv_sync_result.stderr is search('Installing|Installed|Uninstalled|Updated')
  notify: Restart eink-display

- name: Sync all images
  ansible.posix.synchronize:
    src: "files/images/"
    dest: "{{ eink_display_path }}/assets/images/"
    delete: true
    archive: true
    owner: false
    group: false
    rsync_opts:
      - "--chmod=D0775,F0644"
      - "--chown={{ ansible_user }}:{{ ansible_user }}"
  notify: Restart eink-display

- name: Deploy environment variables
  ansible.builtin.template:
    src: eink-display.env.j2
    dest: "{{ eink_display_path }}/eink-display.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart eink-display

- name: Deploy secret environment variables
  ansible.builtin.template:
    src: eink-display.secrets.env.j2
    dest: "{{ eink_display_path }}/eink-display.secrets.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  notify: Restart eink-display

- name: Deploy systemd service file
  ansible.builtin.template:
    src: eink-display.service.j2
    dest: "{{ user_units_path }}/eink-display.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart eink-display

- name: Flush handlers to apply dashboard updates
  ansible.builtin.meta: flush_handlers

- name: Ensure E-Ink Dashboard service is started and enabled
  ansible.builtin.systemd:
    name: "eink-display.service"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
