---
- name: Pull latest E-Ink Dashboard app from GitHub
  ansible.builtin.git:
    repo: "{{ eink_display_repo }}"
    dest: /home/{{ ansible_user }}/eink-display
    version: main
    force: true
  notify: Restart eink-display

- name: Ensure uv is installed via pipx
  ansible.builtin.command:
    cmd: pipx install uv=={{ eink_display_uv_version }}
  args:
    creates: "/home/{{ ansible_user }}/.local/bin/uv"

- name: Install/Sync Python dependencies using uv
  ansible.builtin.command:
    cmd: /home/{{ ansible_user }}/.local/bin/uv sync --frozen --no-dev --extra rpi
  args:
    chdir: /home/{{ ansible_user }}/eink-display
  register: eink_display_uv_sync_result
  changed_when: >
    eink_display_uv_sync_result.stdout is search('Installing|Installed|Uninstalled|Updated') or
    eink_display_uv_sync_result.stderr is search('Installing|Installed|Uninstalled|Updated')
  notify: Restart eink-display

- name: Create assets directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /home/{{ ansible_user }}/eink-display/assets
    - /home/{{ ansible_user }}/eink-display/assets/fonts
    - /home/{{ ansible_user }}/eink-display/assets/images

- name: Sync all images
  ansible.posix.synchronize:
    src: "files/images/"
    dest: "/home/{{ ansible_user }}/eink-display/assets/images/"
    delete: true
    archive: true
    owner: false
    group: false
    rsync_opts:
      - "--chmod=D0755,F0644"
      - "--chown={{ ansible_user }}:{{ ansible_user }}"
  notify: Restart eink-display

- name: Sync all fonts
  ansible.posix.synchronize:
    src: "files/fonts/"
    dest: "/home/{{ ansible_user }}/eink-display/assets/fonts/"
    delete: true
    archive: true
    owner: false
    group: false
    rsync_opts:
      - "--chmod=D0755,F0644"
      - "--chown={{ ansible_user }}:{{ ansible_user }}"
  notify: Restart eink-display

- name: Deploy environment variables
  ansible.builtin.template:
    src: eink-display.env.j2
    dest: "/home/{{ ansible_user }}/eink-display/eink-display.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  notify: Restart eink-display

- name: Deploy systemd service file
  ansible.builtin.template:
    src: eink-display.service.j2
    dest: /home/{{ ansible_user }}/.config/systemd/user/eink-display.service
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart eink-display

- name: Flush handlers to apply dashboard updates
  ansible.builtin.meta: flush_handlers

- name: Ensure E-Ink Dashboard service is started and enabled
  ansible.builtin.systemd:
    name: "eink-display.service"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  ignore_errors: "{{ ansible_check_mode }}"
