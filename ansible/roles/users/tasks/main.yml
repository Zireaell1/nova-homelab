---
- name: Check current version of Zellij
  ansible.builtin.command: zellij --version
  register: users_zellij_cmd_output
  failed_when: false
  check_mode: false
  changed_when: false

- name: Install Zellij from GitHub repo
  ansible.builtin.unarchive:
    src: "{{ users_zellij_link }}"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/zellij
    owner: root
    group: root
    mode: "0755"
  when: users_zellij_cmd_output.rc != 0 or users_zellij_version not in users_zellij_cmd_output.stdout

- name: Verify if group exists
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - render
    - dialout
    - rgb

- name: Assign user to groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - render
    - dialout
    - rgb

- name: Reset SSH connection to apply group changes
  ansible.builtin.meta: reset_connection

- name: Change default shell to Fish
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ users_shell }}"
