---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stacks_path }}/ollama"

- name: Upload .network file
  ansible.builtin.template:
    src: "ollama.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/ollama.network"
    mode: "0644"
  notify: Restart ollama

- name: Upload .env file
  ansible.builtin.template:
    src: "ollama.env.j2"
    dest: "{{ stacks_path }}/ollama/ollama.env"
    mode: "0600"
  no_log: true
  notify: Restart ollama

- name: Upload .container file
  ansible.builtin.template:
    src: "ollama.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/ollama.container"
    mode: "0644"
  notify: Restart ollama

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ ollama_image }}:{{ version_ollama }}"
    state: present
