---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ stacks_path }}/frigate"
    - "{{ stacks_path }}/frigate/config"
    - "{{ frigate_storage_path }}"
    - "{{ frigate_storage_path }}/recordings"
    - "{{ frigate_storage_path }}/clips"
    - "{{ frigate_storage_path }}/exports"

- name: Upload .network file
  ansible.builtin.template:
    src: "frigate.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/frigate.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart frigate

- name: Upload .env file
  ansible.builtin.template:
    src: "frigate.env.j2"
    dest: "{{ stacks_path }}/frigate/frigate.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  notify: Restart frigate

- name: Upload config.yaml file
  ansible.builtin.template:
    src: "config.yaml.j2"
    dest: "{{ stacks_path }}/frigate/config/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart frigate

- name: Upload .container file
  ansible.builtin.template:
    src: "frigate.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/frigate.container"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart frigate

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ frigate_image }}:{{ frigate_version }}"
    state: present
