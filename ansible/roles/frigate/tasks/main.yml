---
- name: Frigate - Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ stacks_path }}/frigate"
    - "{{ stacks_path }}/frigate/config"
    - "{{ frigate_storage_path }}"

- name: Frigate - Upload Frigate Network
  ansible.builtin.template:
    src: "frigate.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/frigate.network"
    mode: '0644'
  notify: Restart frigate

- name: Frigate - Generate .env file
  ansible.builtin.template:
    src: "frigate.env.j2"
    dest: "{{ stacks_path }}/frigate/frigate.env"
    mode: '0600'
  no_log: true
  notify: Restart frigate

- name: Frigate - Upload config.yaml
  ansible.builtin.template:
    src: "config.yaml.j2"
    dest: "{{ stacks_path }}/frigate/config/config.yaml"
    mode: '0644'
  notify: Restart frigate

- name: Frigate - Upload Quadlet Frigate
  ansible.builtin.template:
    src: "frigate.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/frigate.container"
    mode: '0644'
  notify: Restart frigate

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ frigate_image }}"
    state: present
