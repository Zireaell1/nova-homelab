---
- name: Restart openrgb
  ansible.builtin.systemd:
    daemon_reload: true
    name: openrgb.service
    state: restarted
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload Udev rules
  ansible.builtin.command: udevadm control --reload-rules && udevadm trigger
  become: true
  changed_when: true
