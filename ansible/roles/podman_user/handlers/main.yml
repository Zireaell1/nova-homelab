---
- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: Restart podman-prune timer
  ansible.builtin.systemd:
    name: podman-prune.timer
    state: restarted
    daemon_reload: true
    scope: user

- name: Restart prometheus-podman-exporter
  ansible.builtin.systemd:
    name: prometheus-podman-exporter.service
    state: restarted
    daemon_reload: true
    scope: user

- name: Show Podman config restart warning
  ansible.builtin.debug:
    msg: >
      [WARNING] Podman configuration (containers.conf) was updated.
      The changes (e.g., muting healthcheck logs) require a container
      restart to take effect. Please restart your containers or reboot
      the server manually.
