---
- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "/home/{{ ansible_user }}/.config/containers"
    - "/home/{{ ansible_user }}/.config/containers/systemd"
    - "/home/{{ ansible_user }}/.config/systemd/user"
    - "/home/{{ ansible_user }}/.config/systemd/user/prometheus-podman-exporter.service.d"
    - "/home/{{ ansible_user }}/.config/prometheus-podman-exporter"

- name: Upload containers.conf file
  ansible.builtin.template:
    src: "containers.conf.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/containers.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Show Podman config restart warning

- name: Deploy shared podman networks
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - monitoring-backend.network
    - home.network
  notify: Reload systemd user daemon

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "podman-prune.service.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/podman-prune.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "podman-prune.timer.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/podman-prune.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy user-owned env file for podman-exporter
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/prometheus-podman-exporter/podman-exporter.conf"
    mode: "0644"
    content: |
      PODMAN_EXPORTER_OPTS="--collector.enable-all --web.listen-address=127.0.0.1:9882"
  notify: Restart prometheus-podman-exporter

- name: Repoint EnvironmentFile to user-owned config
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/systemd/user/prometheus-podman-exporter.service.d/override.conf"
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile=
      EnvironmentFile=-/home/{{ ansible_user }}/.config/prometheus-podman-exporter/podman-exporter.conf
  notify: Restart prometheus-podman-exporter

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start systemd user services and timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus-podman-exporter.service
    - podman-prune.timer
  ignore_errors: "{{ ansible_check_mode }}"
