---
- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ stacks_path }}"
    - "{{ user_config_path }}/containers"
    - "{{ quadlet_path }}"
    - "{{ user_units_path }}"
    - "{{ user_units_path }}/prometheus-podman-exporter.service.d"
    - "{{ user_config_path }}/prometheus-podman-exporter"

- name: Upload containers.conf file
  ansible.builtin.template:
    src: "containers.conf.j2"
    dest: "{{ user_config_path }}/containers/containers.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Show Podman config restart warning

- name: Deploy podman network quadlets
  ansible.builtin.template:
    src: "network.j2"
    dest: "{{ quadlet_path }}/{{ item.name }}.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ podman_networks }}"
  loop_control:
    label: "{{ item.name }}.network"
  notify:
    - Reload systemd user daemon
    - Show Podman network recreate warning

- name: Stop retired services
  ansible.builtin.systemd:
    name: "{{ item.1 | regex_replace('\\.container$', '.service') }}"
    state: stopped
    scope: user
  loop: "{{ podman_retired_services | subelements('quadlets') }}"
  loop_control:
    label: "{{ item.1 }}"
  failed_when: false

- name: Remove retired quadlets
  ansible.builtin.file:
    path: "{{ quadlet_path }}/{{ item.1 }}"
    state: absent
  loop: "{{ podman_retired_services | subelements('quadlets') }}"
  loop_control:
    label: "{{ item.1 }}"
  notify: Reload systemd user daemon

- name: Purge retired service data
  ansible.builtin.file:
    path: "{{ stacks_path }}/{{ item.name }}"
    state: absent
  loop: "{{ podman_retired_services | selectattr('purge', 'defined') | selectattr('purge') | list }}"
  loop_control:
    label: "{{ stacks_path }}/{{ item.name }}"

- name: Find orphaned network quadlets
  ansible.builtin.find:
    paths: "{{ quadlet_path }}"
    patterns: "*.network"
    excludes: "{{ podman_networks | map(attribute='name') | map('regex_replace', '$', '.network') | list }}"
  register: podman_user_stale_networks

- name: Find deployed quadlets that still join an orphaned network
  ansible.builtin.find:
    paths: "{{ quadlet_path }}"
    patterns: "*.container"
    contains: '^\s*Network\s*=\s*{{ item.path | basename | regex_escape }}\s*$'
  loop: "{{ podman_user_stale_networks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: podman_user_stale_network_users

- name: Remove orphaned network quadlets no container joins any more
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ podman_user_stale_network_users.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when: item.matched == 0
  notify: Reload systemd user daemon

- name: Report orphaned networks kept for now
  ansible.builtin.debug:
    msg: >-
      Kept {{ item.item.path | basename }}: still joined by
      {{ item.files | map(attribute='path') | map('basename') | join(', ') }}.
      It goes on the next run, once that quadlet no longer names it.
  loop: "{{ podman_user_stale_network_users.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when: item.matched > 0

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "podman-prune.service.j2"
    dest: "{{ user_units_path }}/podman-prune.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "podman-prune.timer.j2"
    dest: "{{ user_units_path }}/podman-prune.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy user-owned env file for podman-exporter
  ansible.builtin.copy:
    dest: "{{ user_config_path }}/prometheus-podman-exporter/podman-exporter.conf"
    mode: "0644"
    content: |
      PODMAN_EXPORTER_OPTS="--collector.enable-all --web.listen-address=127.0.0.1:9882"
  notify: Restart prometheus-podman-exporter

- name: Repoint EnvironmentFile to user-owned config
  ansible.builtin.copy:
    dest: "{{ user_units_path }}/prometheus-podman-exporter.service.d/override.conf"
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile=
      EnvironmentFile=-{{ user_config_path }}/prometheus-podman-exporter/podman-exporter.conf
  notify: Restart prometheus-podman-exporter

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start systemd user services and timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus-podman-exporter.service
    - podman-prune.timer
  ignore_errors: "{{ ansible_check_mode }}"
