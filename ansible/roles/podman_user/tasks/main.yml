---
- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ user_config_path }}/containers"
    - "{{ quadlet_path }}"
    - "{{ user_units_path }}"
    - "{{ user_units_path }}/prometheus-podman-exporter.service.d"
    - "{{ user_config_path }}/prometheus-podman-exporter"

- name: Upload containers.conf file
  ansible.builtin.template:
    src: "containers.conf.j2"
    dest: "{{ user_config_path }}/containers/containers.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Show Podman config restart warning

- name: Deploy podman network quadlets
  ansible.builtin.template:
    src: "network.j2"
    dest: "{{ quadlet_path }}/{{ item.name }}.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ podman_networks }}"
  loop_control:
    label: "{{ item.name }}.network"
  register: podman_user_networks
  notify:
    - Reload systemd user daemon
    - Show Podman network recreate warning

- name: Find orphaned network quadlets
  ansible.builtin.find:
    paths: "{{ quadlet_path }}"
    patterns: "*.network"
    excludes: "{{ podman_networks | map(attribute='name') | map('regex_replace', '$', '.network') | list }}"
  register: podman_user_stale_networks

- name: Remove orphaned network quadlets
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ podman_user_stale_networks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Reload systemd user daemon

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "podman-prune.service.j2"
    dest: "{{ user_units_path }}/podman-prune.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "podman-prune.timer.j2"
    dest: "{{ user_units_path }}/podman-prune.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy user-owned env file for podman-exporter
  ansible.builtin.copy:
    dest: "{{ user_config_path }}/prometheus-podman-exporter/podman-exporter.conf"
    mode: "0644"
    content: |
      PODMAN_EXPORTER_OPTS="--collector.enable-all --web.listen-address=127.0.0.1:9882"
  notify: Restart prometheus-podman-exporter

- name: Repoint EnvironmentFile to user-owned config
  ansible.builtin.copy:
    dest: "{{ user_units_path }}/prometheus-podman-exporter.service.d/override.conf"
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile=
      EnvironmentFile=-{{ user_config_path }}/prometheus-podman-exporter/podman-exporter.conf
  notify: Restart prometheus-podman-exporter

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start systemd user services and timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus-podman-exporter.service
    - podman-prune.timer
  ignore_errors: "{{ ansible_check_mode }}"
