---
- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "/home/{{ ansible_user }}/.config/containers"
      mode: "0755"

    - path: "/home/{{ ansible_user }}/.config/containers/systemd"
      mode: "0755"

    - path: "/home/{{ ansible_user }}/.config/systemd/user"
      mode: "0755"

- name: Upload containers.conf file
  ansible.builtin.template:
    src: "containers.conf.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/containers.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Show Podman config restart warning

- name: Upload .network file
  ansible.builtin.template:
    src: "monitoring-backend.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/monitoring-backend.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Reload systemd user daemon

- name: Deploy Systemd Service file
  ansible.builtin.template:
    src: "podman-prune.service.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/podman-prune.service"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Deploy Systemd Timer file
  ansible.builtin.template:
    src: "podman-prune.timer.j2"
    dest: "/home/{{ ansible_user }}/.config/systemd/user/podman-prune.timer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart podman-prune timer

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start systemd user services and timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus-podman-exporter.service
    - podman-prune.timer
  ignore_errors: "{{ ansible_check_mode }}"
