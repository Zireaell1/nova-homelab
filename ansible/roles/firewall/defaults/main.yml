---
firewall_default_zone: public

firewall_zones:
  - name: public
    builtin: true
    services:
      - cockpit # TODO: remove once Caddy proxies Cockpit
      - ntp
      - dns
      - http
      - https
      - ssh
      - dhcpv6-client
    ports:
      - "443/udp" # HTTP/3 (Caddy)
      - "41641/udp" # tailscaled's default listen port: direct peer connections instead of DERP relays
      - "8555/tcp" # Frigate WebRTC (go2rtc)
      - "8555/udp"

  - name: isolated
    target: DROP
    services:
      - ntp

firewall_rich_rules:
  - zone: public
    rule: 'rule family="ipv4" destination address="{{ host_svc_address }}/32" drop'
