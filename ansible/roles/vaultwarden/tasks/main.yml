---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ stacks_path }}/vaultwarden"
    - "{{ stacks_path }}/vaultwarden/data"

- name: Upload .network file
  ansible.builtin.template:
    src: "vaultwarden.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/vaultwarden.network"
    mode: '0644'
  notify: Restart vaultwarden

- name: Upload .env file
  ansible.builtin.template:
    src: "vaultwarden.env.j2"
    dest: "{{ stacks_path }}/vaultwarden/vaultwarden.env"
    mode: '0600'
  no_log: true
  notify: Restart vaultwarden

- name: Upload .container file
  ansible.builtin.template:
    src: "vaultwarden.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/vaultwarden.container"
    mode: '0644'
  notify: Restart vaultwarden

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ vaultwarden_image }}"
    state: present
