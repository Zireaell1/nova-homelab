---
- name: Deploy Mosquitto
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: mosquitto
    podman_service_dirs:
      - "{{ stacks_path }}/mosquitto"
      - "{{ stacks_path }}/mosquitto/config"
      - "{{ stacks_path }}/mosquitto/data"
    podman_service_templates:
      - src: mosquitto.conf.j2
        dest: "{{ stacks_path }}/mosquitto/config/mosquitto.conf"
        mode: "0644"
    podman_service_secrets:
      content: "{{ vault_mosquitto_pwfile_content }}"
      dest: "{{ stacks_path }}/mosquitto/config/pwfile"
    podman_service_quadlets: ["mosquitto.container"]
    podman_service_images: ["{{ mosquitto_image }}:{{ mosquitto_version }}"]
