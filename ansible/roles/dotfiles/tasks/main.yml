---
- name: Load the package-manager commands for this host's OS family
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Verify if config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    # TODO permissions
    - path: "{{ user_tools_path }}"
      mode: "0755"

    - path: "{{ user_config_path }}/fish"
      mode: "0700"

    - path: "{{ user_config_path }}/fish/completions"
      mode: "0755"

    - path: "{{ user_config_path }}/fastfetch"
      mode: "0744"

    - path: "{{ user_config_path }}/zellij"
      mode: "0755"

    - path: "{{ user_config_path }}/zellij/layouts"
      mode: "0755"

    - path: "{{ user_bin_path }}"
      mode: "0755"

- name: Deploy Fish config
  ansible.builtin.template:
    src: "config.fish.j2"
    dest: "{{ user_config_path }}/fish/config.fish"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Check whether Zellij is installed
  ansible.builtin.command: zellij --version
  register: dotfiles_zellij_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Generate Zellij completions for Fish
  ansible.builtin.shell: zellij setup --generate-completion fish > {{ user_config_path }}/fish/completions/zellij.fish
  args:
    creates: "{{ user_config_path }}/fish/completions/zellij.fish"
  when: dotfiles_zellij_check.rc == 0

- name: Upload Fastfetch config
  ansible.builtin.copy:
    src: "fastfetch/config.jsonc"
    dest: "{{ user_config_path }}/fastfetch/config.jsonc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Upload Zellij config
  ansible.builtin.copy:
    src: "zellij/config.kdl"
    dest: "{{ user_config_path }}/zellij/config.kdl"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Upload Zellij layout
  ansible.builtin.copy:
    src: "zellij/default_strider.kdl"
    dest: "{{ user_config_path }}/zellij/layouts/default_strider.kdl"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
