---
# Default: #allow 192.168.0.0/16
- name: Allow NTP queries for selected subnet
  ansible.builtin.lineinfile:
    path: "/etc/chrony.conf"
    regexp: '^#?allow\s+'
    line: "allow {{ vault_network_cctv }}"
    state: present
  notify: Restart chronyd

- name: Enable cockpit.socket
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure SSH hardening (disable password auth)
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Ensure filter.d directory exists
  ansible.builtin.file:
    path: /etc/fail2ban/filter.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Vaultwarden filter
  ansible.builtin.template:
    src: vaultwarden.local.j2
    dest: /etc/fail2ban/filter.d/vaultwarden.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Configure jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban.service
    state: started
    enabled: true
