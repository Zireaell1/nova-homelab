---
- name: Let users set services on ports 53+
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "53"
    sysctl_set: true
    state: present
    reload: true

- name: Enable IPv4 and IPv6 forwarding for routing
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
