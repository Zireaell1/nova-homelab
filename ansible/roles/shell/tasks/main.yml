---
- name: Install interactive shell tooling
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] }}.yml"

- name: Assert Zellij ships a musl tarball under this architecture name
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in shell_zellij_supported_arches
    fail_msg: >-
      Zellij's release asset for {{ ansible_facts['architecture'] }} does not follow
      the "<arch>-unknown-linux-musl" pattern.
    quiet: true

- name: Check current version of Zellij
  ansible.builtin.command: zellij --version
  register: shell_zellij_cmd_output
  failed_when: false
  check_mode: false
  changed_when: false

- name: Install Zellij from GitHub releases
  ansible.builtin.unarchive:
    src: "{{ shell_zellij_link }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: shell_zellij_cmd_output.rc != 0 or shell_zellij_version not in shell_zellij_cmd_output.stdout

- name: Change default shell to Fish
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ shell_login_shell }}"

- name: Read Ghostty terminfo from the rootless user's database
  become: false
  ansible.builtin.command: "infocmp -x xterm-ghostty"
  register: shell_ghostty_terminfo_src
  changed_when: false
  failed_when: false

- name: Warn if the rootless user has no Ghostty terminfo
  ansible.builtin.debug:
    msg: >
      [WARNING] xterm-ghostty terminfo not found for {{ ansible_user }}.
      SSH into the host at least once with Ghostty as {{ ansible_user }} so its
      shell integration installs the entry, then re-run this role.
  when: shell_ghostty_terminfo_src.rc != 0

- name: Read the system-wide Ghostty terminfo
  ansible.builtin.command: "infocmp -x -A /usr/share/terminfo xterm-ghostty"
  register: shell_ghostty_terminfo_sys
  changed_when: false
  failed_when: false
  when: shell_ghostty_terminfo_src.rc == 0

- name: Install or refresh Ghostty terminfo in /usr/share/terminfo (all users)
  ansible.builtin.command: "tic -x -o /usr/share/terminfo -"
  args:
    stdin: "{{ shell_ghostty_terminfo_src.stdout }}"
  when:
    - shell_ghostty_terminfo_src.rc == 0
    - shell_ghostty_terminfo_sys.rc != 0 or
      (shell_ghostty_terminfo_src.stdout_lines | reject('match', '#') | list) !=
      (shell_ghostty_terminfo_sys.stdout_lines | reject('match', '#') | list)
  changed_when: true
