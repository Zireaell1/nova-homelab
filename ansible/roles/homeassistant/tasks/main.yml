---
- name: Verify Home Assistant seed directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ stacks_path }}/homeassistant/config/custom_components/hacs"
    - "{{ caddy_srv_path }}/homeassistant"

- name: Download and extract HACS release
  ansible.builtin.unarchive:
    src: https://github.com/hacs/integration/releases/download/{{ homeassistant_hacs_version }}/hacs.zip
    dest: "{{ stacks_path }}/homeassistant/config/custom_components/hacs"
    remote_src: true
    creates: "{{ stacks_path }}/homeassistant/config/custom_components/hacs/manifest.json"
  register: homeassistant_hacs

- name: Seed user-editable Home Assistant files
  ansible.builtin.copy:
    content: ""
    dest: "{{ stacks_path }}/homeassistant/config/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    force: false
  loop:
    - automations.yaml
    - scripts.yaml
    - scenes.yaml
  register: homeassistant_seed_files

- name: Download Home Assistant Android App
  ansible.builtin.get_url:
    url: "https://github.com/home-assistant/android/releases/download/{{ homeassistant_android_version }}/app-minimal-release.apk"
    dest: "{{ stacks_path }}/caddy/srv/homeassistant/home-assistant-android-{{ homeassistant_android_version }}.apk"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    setype: "container_file_t"

- name: Find superseded Android APKs
  ansible.builtin.find:
    paths: "{{ caddy_srv_path }}/homeassistant"
    patterns: "home-assistant-android-*.apk"
    excludes: "home-assistant-android-{{ homeassistant_android_version }}.apk"
  register: homeassistant_old_apks

- name: Prune superseded Android APKs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ homeassistant_old_apks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Deploy Home Assistant
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: homeassistant
    podman_service_dirs:
      - "{{ stacks_path }}/homeassistant"
      - "{{ stacks_path }}/homeassistant/config"
      - "{{ stacks_path }}/homeassistant/config/custom_components"
      - "{{ stacks_path }}/homeassistant/config/www"
      - "{{ stacks_path }}/homeassistant/config/blueprints"
      - "{{ stacks_path }}/homeassistant/config/themes"
      - "{{ stacks_path }}/homeassistant/config/ansible_managed"
    podman_service_templates:
      - src: configuration.yaml.j2
        dest: "{{ stacks_path }}/homeassistant/config/configuration.yaml"
        mode: "0644"
      - src: prometheus_filter.yaml.j2
        dest: "{{ stacks_path }}/homeassistant/config/ansible_managed/prometheus_filter.yaml"
        mode: "0644"
    podman_service_quadlets: ["homeassistant.container"]
    podman_service_images:
      ["{{ homeassistant_image }}:{{ homeassistant_version }}"]
    podman_service_changed_extra: >-
      {{ (homeassistant_hacs is changed) or (homeassistant_seed_files is changed) }}
