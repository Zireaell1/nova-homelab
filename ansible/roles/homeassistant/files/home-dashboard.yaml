views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:home-outline
            sub_button:
              main: []
              bottom: []
            name: Dom
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Ganek
            icon: mdi:door
            sub_button:
              main:
                - entity: binary_sensor.frontdoor_sensor_contact_contact
                  show_state: true
                  tap_action:
                    action: none
              bottom: []
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#entrance"
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Korytarz
            icon: mdi:vector-line
            sub_button:
              main:
                - entity: sensor.hallway_sensor_climate_temperature
                  show_state: true
                  tap_action:
                    action: none
                - entity: sensor.hallway_sensor_climate_humidity
                  show_state: true
                  tap_action:
                    action: none
              bottom: []
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#hallway"
          - type: custom:bubble-card
            card_type: button
            sub_button:
              main:
                - entity: binary_sensor.boilerroom_sensor_contact_contact
                  show_state: true
                  tap_action:
                    action: none
              bottom: []
            button_type: name
            name: Kotłownia
            icon: mdi:heat-wave
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#boilerroom"
          - type: custom:bubble-card
            card_type: button
            sub_button:
              main:
                - entity: binary_sensor.livingroom_contact_sensor_contact
                  show_state: true
                  tap_action:
                    action: none
              bottom: []
            button_type: name
            name: Salon
            icon: mdi:sofa
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#livingroom"
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                sub_button:
                  main: []
                  bottom: []
                button_type: name
                name: Kuchnia
                icon: mdi:chef-hat
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#kitchen"
              - type: custom:bubble-card
                card_type: button
                sub_button:
                  main: []
                  bottom: []
                button_type: name
                name: Sypialnia
                icon: mdi:bed
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#bedroom"
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                sub_button:
                  main: []
                  bottom: []
                button_type: name
                name: Łazienka
                icon: mdi:shower
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#bathroom"
              - type: custom:bubble-card
                card_type: button
                sub_button:
                  main: []
                  bottom: []
                button_type: name
                name: Pokój 1
                icon: mdi:laptop
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: "#room-1"
          - type: custom:bubble-card
            card_type: button
            sub_button:
              main: []
              bottom: []
            button_type: name
            name: Pokój 2
            icon: mdi:record-circle
            tap_action:
              action: navigate
              navigation_path: "#room-2"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#room-2"
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            sub_button:
              main: []
              bottom: []
            icon: mdi:calendar
            name: Kalendarz
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            sub_button:
              main: []
              bottom: []
            icon: mdi:weather-partly-cloudy
            name: Pogoda
          - show_current: true
            show_forecast: false
            type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            round_temperature: false
            tap_action:
              action: none
          - show_current: false
            show_forecast: true
            type: weather-forecast
            entity: weather.forecast_home
            forecast_type: hourly
            forecast_slots: 10
            tap_action:
              action: none
          - show_current: false
            show_forecast: true
            type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            forecast_slots: 10
            tap_action:
              action: none
      - type: grid
        cards: []
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            name: Ganek
            icon: mdi:door
            hash: "#entrance"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Korytarz
            icon: mdi:vector-line
            hash: "#hallway"
            cards:
              - graph: line
                type: sensor
                entity: sensor.hallway_sensor_climate_temperature
                detail: 1
                name: Temperatura
              - graph: line
                type: sensor
                entity: sensor.hallway_sensor_climate_humidity
                detail: 1
                name: Wilgotność
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Kotłownia
            icon: mdi:heat-wave
            hash: "#boilerroom"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Salon
            icon: mdi:sofa
            hash: "#livingroom"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Kuchnia
            icon: mdi:chef-hat
            hash: "#kitchen"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Sypialnia
            icon: mdi:bed
            hash: "#bedroom"
            cards:
              - graph: line
                type: sensor
                entity: sensor.bedroom_plug_1_power
                detail: 1
                name: Gniazdo 1
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Łazienka
            icon: mdi:shower
            hash: "#bathroom"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Pokój 1
            icon: mdi:laptop
            hash: "#room-1"
            cards:
              - graph: line
                type: sensor
                entity: sensor.room1_plug_pc_power
                detail: 1
                name: Gniazdo PC
              - type: custom:bubble-card
                card_type: button
                button_type: slider
                sub_button:
                  main:
                    - entity: light.asrock_z890i_nova_wifi
                      sub_button_type: select
                      select_attribute: effect_list
                      icon: mdi:creation
                      show_state: true
                  bottom: []
                entity: light.asrock_z890i_nova_wifi
                name: Podświetlenie
                icon: mdi:lightbulb
                show_state: false
                show_attribute: false
                attribute: color_mode
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
          - type: custom:bubble-card
            card_type: pop-up
            name: Pokój 2
            icon: mdi:record-circle
            hash: "#room-2"
            cards: []
            button_type: name
            sub_button:
              main: []
              bottom: []
            show_header: true
            show_previous_button: false
    max_columns: 4
    title: Home
    icon: mdi:home
    cards: []
    header:
      card:
        type: markdown
        content: |
          ## {{ states('sensor.dashboard_greeting') }}
          **{{ states('sensor.polish_date') }}**
        text_only: true
  - type: sections
    max_columns: 4
    title: Doorbell
    path: doorbell
    icon: mdi:doorbell-video
    sections:
      - type: grid
        cards:
          - type: custom:advanced-camera-card
            cameras:
              - live_provider: go2rtc
                id: doorbell-go2rtc
                title: Doorbell
                go2rtc:
                  modes:
                    - webrtc
                    - mse
                capabilities:
                  disable:
                    - clips
                    - favorite-events
                    - favorite-recordings
                    - ptz
                    - recordings
                    - seek
                    - snapshots
                    - substream
                frigate:
                  camera_name: Doorbell
            view:
              default: live
            menu:
              style: outside
              position: bottom
              alignment: right
              button_size: 80
              buttons:
                iris:
                  enabled: false
                cameras:
                  enabled: false
                substreams:
                  enabled: false
                live:
                  enabled: false
                clips:
                  enabled: false
                snapshots:
                  enabled: false
                folders:
                  enabled: false
                download:
                  enabled: false
                camera_ui:
                  enabled: false
                fullscreen:
                  enabled: false
                timeline:
                  enabled: false
                media_player:
                  enabled: false
                microphone:
                  enabled: true
                  type: toggle
                  icon: mdi:microphone-off
                mute:
                  enabled: true
                display_mode:
                  enabled: false
            status_bar:
              style: none
            live:
              controls:
                builtin: false
              microphone:
                disconnect_seconds: 120
                mute_after_microphone_mute_seconds: 120
            overrides:
              - conditions:
                  - condition: microphone
                    connected: true
                merge:
                  menu:
                    buttons:
                      microphone:
                        enabled: true
            elements:
              - type: custom:advanced-camera-card-conditional
                conditions:
                  - condition: state
                    state: "on"
                    entity: input_boolean.doorbell_calling
                elements:
                  - type: custom:advanced-camera-card-menu-icon
                    icon: mdi:phone
                    title: Odbierz
                    alignment: opposing
                    priority: 39
                    style:
                      color: green
                    tap_action:
                      - action: perform-action
                        data:
                          entity_id: input_boolean.doorbell_calling
                        perform_action: input_boolean.turn_off
                      - action: custom:advanced-camera-card-action
                        advanced_camera_card_action: microphone_unmute
              - type: custom:advanced-camera-card-conditional
                conditions:
                  - condition: state
                    state: "off"
                    entity: input_boolean.doorbell_calling
                  - condition: microphone
                    connected: false
                elements:
                  - type: custom:advanced-camera-card-menu-icon
                    icon: mdi:phone-outgoing
                    title: Połącz
                    alignment: opposing
                    priority: 39
                    style:
                      color: green
                    tap_action:
                      - action: custom:advanced-camera-card-action
                        advanced_camera_card_action: microphone_unmute
              - type: custom:advanced-camera-card-conditional
                conditions:
                  - condition: state
                    state: "on"
                    entity: input_boolean.doorbell_calling
                elements:
                  - type: custom:advanced-camera-card-menu-icon
                    icon: mdi:phone-ring
                    title: Odrzuć
                    alignment: opposing
                    priority: 40
                    style:
                      color: red
                    tap_action:
                      - action: perform-action
                        data:
                          entity_id: input_boolean.doorbell_calling
                        perform_action: input_boolean.turn_off
              - type: custom:advanced-camera-card-conditional
                conditions:
                  - condition: state
                    state: "off"
                    entity: input_boolean.doorbell_calling
                  - condition: microphone
                    connected: true
                elements:
                  - type: custom:advanced-camera-card-menu-icon
                    icon: mdi:phone-hangup
                    title: Rozłącz
                    alignment: opposing
                    priority: 40
                    style:
                      color: red
                    tap_action:
                      - action: custom:advanced-camera-card-action
                        advanced_camera_card_action: microphone_disconnect
                      - action: custom:advanced-camera-card-action
                        advanced_camera_card_action: mute
              - type: custom:advanced-camera-card-menu-state-icon
                entity: schedule.doorbell_do_not_disturb
                title: Nie przeszkadzaj
                state_color: true
                tap_action:
                  action: toggle
                alignment: opposing
                priority: 41
            grid_options:
              columns: 24
              rows: auto
        column_span: 2
      - type: grid
        cards:
          - type: custom:advanced-camera-card
            cameras:
              - live_provider: image
                id: front-image
                title: Front
                capabilities:
                  disable:
                    - clips
                    - favorite-events
                    - favorite-recordings
                    - ptz
                    - recordings
                    - seek
                    - snapshots
                    - substream
                    - menu
                camera_entity: camera.front
            view:
              default: live
            menu:
              style: none
            status_bar:
              style: none
            live:
              controls:
                builtin: false
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                sub_button:
                  main: []
                  bottom: []
                entity: binary_sensor.frontdoor_sensor_contact_contact
                name: Główne
              - type: custom:bubble-card
                card_type: button
                button_type: state
                sub_button:
                  main: []
                  bottom: []
                entity: binary_sensor.livingroom_contact_sensor_contact
                name: Salon
              - type: horizontal-stack
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    sub_button:
                      main: []
                      bottom: []
                    entity: binary_sensor.boilerroom_sensor_contact_contact
                    name: Kotłownia
          - show_state: true
            show_name: false
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: image.doorbell_person
            tap_action:
              action: none
        column_span: 1
  - type: sections
    path: cctv
    max_columns: 4
    title: CCTV
    icon: mdi:cctv
    sections:
      - type: grid
        cards: []
