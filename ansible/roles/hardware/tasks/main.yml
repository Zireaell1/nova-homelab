---
- name: Software install
  ansible.builtin.dnf:
    name:
      - lm_sensors
    state: present

- name: Upload lm_sensors config
  ansible.builtin.copy:
    src: "lm_sensors/lm_sensors"
    dest: "/etc/sysconfig/lm_sensors"
    owner: root
    group: root
    mode: "0644"
  notify: Restart lm_sensors

# https://docs.kernel.org/hwmon/nct6683.html
- name: Load nct6683 module and make it persistent
  community.general.modprobe:
    name: nct6683
    params: "force=1"
    state: present
    persistent: present

- name: Ensure Logical Volumes exist and are sized correctly
  community.general.lvol:
    vg: "{{ hardware_vg_name }}"
    lv: "{{ item.name }}"
    size: "{{ item.size }}"
    resizefs: true
    shrink: false
  loop: "{{ hardware_target_lvs }}"

- name: Ensure XFS filesystem is formatted on required LVs
  community.general.filesystem:
    fstype: xfs
    dev: "/dev/{{ hardware_vg_name }}/{{ item.name }}"
  loop: "{{ hardware_target_lvs }}"
  when: item.manage_fs_and_mount | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure required LVs are in fstab and mounted
  ansible.posix.mount:
    path: "{{ item.mount_path }}"
    src: "/dev/{{ hardware_vg_name }}/{{ item.name }}"
    fstype: xfs
    state: mounted
  loop: "{{ hardware_target_lvs }}"
  when: item.manage_fs_and_mount | bool

- name: Hand over rootless-owned mount points
  ansible.builtin.file:
    path: "{{ item.mount_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ hardware_target_lvs }}"
  when: item.rootless | default(false)
  loop_control:
    label: "{{ item.mount_path }}"

- name: Check if mountpoints exists
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ hardware_data_drives }}"

- name: Mount drives and add to fstab
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    dump: "0"
    passno: "{{ item.passno }}"
    opts: "defaults,nofail{{ ',X-fstrim.notrim' if item.fstrim_notrim | default(false) else '' }}"
    state: mounted
  loop: "{{ hardware_data_drives }}"

- name: Ensure correct permissions on mounted drives
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ hardware_data_drives }}"

- name: Upload custom Udev rules for ASRock RGB
  ansible.builtin.template:
    src: "asrock-rgb.rules.j2"
    dest: "/etc/udev/rules.d/99-asrock-rgb.rules"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload Udev rules
    - Retrigger rgb devices

- name: Create systemd drop-in directory for fstrim.timer
  ansible.builtin.file:
    path: "/etc/systemd/system/fstrim.timer.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure fstrim.timer override schedule
  ansible.builtin.template:
    src: "fstrim_override.conf.j2"
    dest: "/etc/systemd/system/fstrim.timer.d/override.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fstrim timer

- name: Flush handlers to apply hardware and systemd changes
  ansible.builtin.meta: flush_handlers

- name: Ensure hardware services and timers are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - lm_sensors.service
    - fstrim.timer
  ignore_errors: "{{ ansible_check_mode }}"
