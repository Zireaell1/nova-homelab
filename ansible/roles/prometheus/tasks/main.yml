---
- name: Verify directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "/srv/monitoring/prometheus"
    - "/srv/monitoring/prometheus/data"

- name: Upload prometheus.yml file
  ansible.builtin.template:
    src: "prometheus.yml.j2"
    dest: "/srv/monitoring/prometheus/prometheus.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart prometheus

- name: Upload .network file
  ansible.builtin.template:
    src: "prometheus.network.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/prometheus.network"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart prometheus

- name: Upload .container file
  ansible.builtin.template:
    src: "prometheus.container.j2"
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/prometheus.container"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart prometheus

- name: Download Podman images
  containers.podman.podman_image:
    name: "{{ prometheus_image }}:{{ prometheus_version }}"
    state: present

- name: Flush handlers to restart stack if configurations changed
  ansible.builtin.meta: flush_handlers

- name: Ensure stack is started and enabled
  ansible.builtin.systemd:
    daemon_reload: true
    name: prometheus.service
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  ignore_errors: "{{ ansible_check_mode }}"
