---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban.service
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded
  ignore_errors: "{{ ansible_check_mode }}"

- name: Apply Frigate SELinux policy
  ansible.builtin.command: restorecon -R -F /mnt/frigate/storage
  changed_when: true
