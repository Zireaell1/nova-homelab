---
- name: Deploy Pi-hole
  ansible.builtin.include_role:
    name: podman_service
  vars:
    podman_service_name: pihole
    podman_service_dirs:
      - "{{ stacks_path }}/pihole"
      - "{{ stacks_path }}/pihole/etc-pihole"
    podman_service_templates:
      - src: pihole.env.j2
        dest: "{{ stacks_path }}/pihole/pihole.env"
        mode: "0644"
      - src: pihole.secrets.env.j2
        dest: "{{ stacks_path }}/pihole/pihole.secrets.env"
        mode: "0600"
        no_log: true
    podman_service_quadlets: ["pihole.container"]
    podman_service_images: ["{{ pihole_image }}:{{ pihole_version }}"]

- name: Wait for Pi-hole to answer on 127.0.0.1:53
  ansible.builtin.wait_for:
    port: 53
    host: 127.0.0.1
    timeout: 60
  ignore_errors: "{{ ansible_check_mode }}"
