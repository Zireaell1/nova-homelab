---
- name: Orion Maintenance and Updates
  hosts: orion
  become: true
  tasks:
    - name: APT full upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        autoremove: true
        autoclean: true

    - name: Check if a reboot is required after update
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify that a reboot is required after update
      ansible.builtin.debug:
        msg: "WARNING: A reboot is required after the APT upgrade. Please restart Orion manually."
      when: reboot_required.stat.exists
