---
- name: Nova rootless services
  hosts: nova
  become: false
  environment: "{{ podman_user_env }}"
  roles:
    # =====================================================
    # Runtime environment
    # =====================================================
    - role: podman_user
      tags: ["podman_user", "runtime"]

    - role: dotfiles
      tags: ["dotfiles", "runtime"]

    # =====================================================
    # Services
    # =====================================================
    # --- DNS ---
    - role: pihole
      tags: ["pihole", "services"]

    # --- IoT and hardware bridges ---
    - role: mosquitto
      tags: ["mosquitto", "services", "iot"]
    - role: openrgb
      tags: ["openrgb", "services", "iot"]
    - role: peanut
      tags: ["peanut", "services", "iot"]
    - role: zigbee2mqtt
      tags: ["zigbee2mqtt", "services", "iot"]

    # --- Backup server ---
    - role: restic
      tags: ["restic", "services"]

    # --- Observability stack ---
    - role: prometheus
      tags: ["prometheus", "services", "monitoring"]
    - role: loki
      tags: ["loki", "services", "monitoring"]
    - role: grafana
      tags: ["grafana", "services", "monitoring"]

    # --- Smart home ---
    - role: frigate
      tags: ["frigate", "services", "home"]
    - role: homeassistant
      tags: ["homeassistant", "services", "home"]

    # --- Services ---
    - role: vaultwarden
      tags: ["vaultwarden", "services"]
    - role: homepage
      tags: ["homepage", "services"]

    # --- Access control ---
    - role: authelia
      tags: ["authelia", "services", "access_control"]
    - role: caddy
      tags: ["caddy", "services", "access_control"]

    # =====================================================
    # Backup scripts (Rootless)
    # =====================================================
    - role: backup
      tags: ["backup", "maintenance"]
