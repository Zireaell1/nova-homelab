---
git_backup_repos:
  - name: "nova-homelab.git"
    url: "https://github.com/Zireaell1/nova-homelab.git"
  - name: "nova-eink-display.git"
    url: "https://github.com/Zireaell1/nova-eink-display.git"

backup_targets:
  - name: frigate
    paths:
      - "{{ frigate_storage_path }}/exports"
      - "{{ stacks_path }}/frigate/config/model_cache"
  - name: restic
    paths:
      - "{{ git_backup_dir }}"
      - "{{ ansible_escrow_dir }}"
  - name: vaultwarden
    stop: true
    paths:
      - "{{ stacks_path }}/vaultwarden/data"
    excludes:
      - "{{ stacks_path }}/vaultwarden/data/icon_cache"
  - name: authelia-postgres
    stop: true
    paths:
      - "{{ stacks_path }}/authelia/postgres"
  - name: zigbee2mqtt
    stop: true
    paths:
      - "{{ stacks_path }}/zigbee2mqtt/data"
      - "{{ stacks_path }}/zigbee2mqtt/config/devices.yaml"
      - "{{ stacks_path }}/zigbee2mqtt/config/groups.yaml"
  - name: homeassistant
    stop: true
    paths:
      - "{{ stacks_path }}/homeassistant/config"
    excludes:
      - "{{ stacks_path }}/homeassistant/config/backups"
      - "{{ stacks_path }}/homeassistant/config/tts"
      - "{{ stacks_path }}/homeassistant/config/.cache"
      - "{{ stacks_path }}/homeassistant/config/home-assistant.log*"
