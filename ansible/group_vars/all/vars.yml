---
stacks_path: "/home/{{ ansible_user }}/stacks"

timezone: "Europe/Warsaw"

services:
  files:
    subdomain: "files"
  alloy:
    subdomain: "alloy"
  authelia:
    subdomain: "auth"
  authelia_postgres:
    quadlet_name: "authelia-postgres.service"
  authelia_redis:
    quadlet_name: "authelia-redis.service"
  frigate:
    subdomain: "frigate"
  grafana:
    subdomain: "grafana"
  pihole:
    subdomain: "pihole"
  prometheus:
    subdomain: "prometheus"
  loki:
    subdomain: "logs"
  restic:
    subdomain: "backup"
  immich:
    subdomain: "immich"
  vaultwarden:
    subdomain: "vault"
    quadlet_name: "vaultwarden"
    backup:
      stop: true
      paths:
        - /home/{{ ansible_user }}/stacks/vaultwarden/data
      excludes:
        - /home/{{ ansible_user }}/stacks/vaultwarden/data/icon_cache
  go2rtc:
    subdomain: "go2rtc"
  zigbee2mqtt:
    subdomain: "z2m"
  homeassistant:
    subdomain: "ha"
  uptime_kuma:
    subdomain: "kuma"
  peanut:
    subdomain: "peanut"
  cockpit:
    subdomain: "cockpit"
  switch:
    subdomain: "switch"
  mainsail:
    subdomain: "mainsail"
  camera_doorbell:
    subdomain: "camera-doorbell"
  camera_front:
    subdomain: "camera-front"
  camera_back:
    subdomain: "camera-back"
  camera_entry:
    subdomain: "camera-entry"

primary_ip: "192.168.3.2"
secondary_ip: "10.10.10.1"

dashboard_tablet_ip: "192.168.4.10"
printer_ip: "192.168.2.9"
switch_ip: "10.10.10.2"

camera_doorbell_ip: "10.10.10.10"
camera_front_ip: "10.10.10.11"
camera_back_ip: "10.10.10.12"
camera_entry_ip: "10.10.10.13"

network_tailscale: "100.64.0.0/10"
network_home: "192.168.2.0/24"
network_homelab: "192.168.3.0/24"
network_iot: "192.168.4.0/24"
network_cctv: "10.10.10.0/24"

primary_network_interface_name: "enp129s0"
secondary_network_interface_name: "enp2s0"
