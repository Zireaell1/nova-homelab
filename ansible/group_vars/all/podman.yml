---
podman_user_env:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] | default(1000, true) }}"

podman_unprivileged_port_start: 53

podman_networks:
  - { name: home, internal: true }
  - { name: monitoring-backend, internal: true }
  - { name: authelia, internal: true }
  - { name: frigate }
  - { name: grafana }
  - { name: homeassistant }
  - { name: homepage, internal: true }
  - { name: immich }
  - { name: loki }
  - { name: nut-exporter }
  - { name: prometheus }
  - { name: vaultwarden }
  - { name: zigbee2mqtt }
  - { name: authelia-backend, internal: true }
  - { name: immich-backend, internal: true }
  - { name: openrgb, internal: true }
  - { name: restic, internal: true }

# Services removed from the repo. For each entry podman_user stops the unit,
# deletes its quadlet files and reloads systemd. Nothing else is restarted, and
# data under stacks_path stays unless purge: true. Drop an entry once every
# host has run it.
#   - { name: peanut, quadlets: [peanut.container], purge: false }
podman_retired_services: []
