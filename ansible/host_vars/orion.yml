---
# [install] changes on a reinstall
# [hw] describes the attached hardware
# [site] a choice for this host

alloy_enable_smartmon: false # [hw]

alloy_config_template: "config_orion.alloy.j2" # [site]

rpi_base_static_hosts:
  - "{{ service_endpoints['prometheus']['subdomain'] }}" # [site]
  - "{{ service_endpoints['loki']['subdomain'] }}" # [site]
  - "{{ service_endpoints['authelia']['subdomain'] }}" # [site]

sshd_allow_tcp_forwarding: "local" # [site]
