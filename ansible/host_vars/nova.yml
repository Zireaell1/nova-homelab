---
# [install]  changes on a reinstall or when a disk is reformatted/replaced
# [hw]       describes the attached hardware: changes only when that hardware does
# [site]     a choice for this host: change it whenever you like

alloy_enable_smartmon: true # [hw]

alloy_enable_intel_gpu: true # [hw]

alloy_enable_intel_npu: true # [hw]

alloy_enable_modem_metrics: true # [hw]

alloy_config_template: "config_nova.alloy.j2" # [site]

hardware_data_drives: # [install]
  - uuid: "3ddf5ac7-b3a8-4ac2-8573-f38c02297c04"
    fstype: "xfs"
    mountpoint: "{{ backup_mount }}"
    passno: "0"
    fstrim_notrim: true

  - uuid: "cb64996e-45e2-4806-b8b1-f14635ecaa2f"
    fstype: "xfs"
    mountpoint: "{{ frigate_mount }}"
    passno: "0"
    fstrim_notrim: true

hardware_target_lvs: # [site]
  - name: root
    size: 15g
    manage_fs_and_mount: false
  - name: home
    size: 75g
    mount_path: /home
    manage_fs_and_mount: true
  - name: monitoring
    size: 20g
    mount_path: "{{ monitoring_path }}"
    manage_fs_and_mount: true
    rootless: true
  - name: immich
    size: 150g
    mount_path: "{{ immich_path }}"
    manage_fs_and_mount: true
    rootless: true
  - name: paperless
    size: 20g
    mount_path: "{{ paperless_path }}"
    manage_fs_and_mount: true
    rootless: true

hardware_vg_name: "fedora_{{ nova_hostname }}" # [install]

zigbee2mqtt_adapter_path: "/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_348e0dcf501fef11abc857d0639e525b-if00-port0" # [hw]

primary_network_interface_name: "enp129s0" # [hw]
secondary_network_interface_name: "enp2s0" # [hw]

nut_ups_vendorid: "0463" # [hw]
nut_ups_productid: "ffff" # [hw]

alloy_smartd_device_overrides: # [hw]
  - device: /dev/disk/by-id/ata-WDC_WD43PURZ-74BWPY0_WD-WX32DB4NA9AL
    directives: "-H -f -l error -l selftest -s S/../.././02"
